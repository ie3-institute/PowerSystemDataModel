plugins {
  id 'java' //java support
  id 'groovy' // groovy support
  id 'maven-publish'
  id 'signing'
  id 'pmd' // code check, working on source code
  id 'com.diffplug.spotless' version '8.10.1' //code format
  id 'com.github.spotbugs' version '6.5.11' // code check, working on byte code
  id 'de.undercouch.download' version '5.7.0'
  id 'kr.motd.sphinx' version '2.10.1' // documentation generation
  id 'jacoco' // java code coverage plugin
  id "org.sonarqube" version "7.4.0.8496" // sonarqube
  id 'net.thauvin.erik.gradle.semver' version '1.0.4' // semantic versioning
  id 'com.gradleup.shadow' version '9.6.1' // fat jar
}

ext {
  //version (changing these should be considered thoroughly!)
  javaVersion = JavaVersion.VERSION_21
  groovyBinaryVersion = "5.1.1"

  junitVersion = '6.1.3'
  testcontainersVersion = '2.0.5'

  scriptsLocation = 'gradle' + File.separator + 'scripts' + File.separator //location of script plugins
}

group = 'com.github.ie3-institute'
description = 'PowerSystemDataModel'

java {
  sourceCompatibility = javaVersion
  targetCompatibility = javaVersion
}

apply from: scriptsLocation + 'tests.gradle'
apply from: scriptsLocation + 'pmd.gradle'
apply from: scriptsLocation + 'spotbugs.gradle'
apply from: scriptsLocation + 'spotless.gradle'
apply from: scriptsLocation + 'checkJavaVersion.gradle'
apply from: scriptsLocation + 'documentation.gradle'
apply from: scriptsLocation + 'jacoco.gradle' // jacoco java code coverage
apply from: scriptsLocation + 'uploadToMavenCentralPortal.gradle' // upload for deploy
apply from: scriptsLocation + 'stagingAtMavenCentralPortal.gradle' // stage for deploy
apply from: scriptsLocation + 'sonarqube.gradle'
apply from: scriptsLocation + 'vcs.gradle'
apply from: scriptsLocation + 'semVer.gradle'
apply from: scriptsLocation + 'branchName.gradle' // checks naming scheme of branches
apply from: scriptsLocation + 'codegen.gradle'

repositories {
  mavenCentral() // searches in Sonatype's repository 'Maven Central'
}

dependencies {

  //	 ie³ power system utils
  implementation 'com.github.ie3-institute:PowerSystemUtils:3.2.2'

  implementation 'tech.units:indriya:2.2.4'

  // JTS Topology Suite for GeoPositions, License: EPL 1.0 / EDL 1.0
  implementation('org.locationtech.jts:jts-core:1.20.0'){
    exclude group: 'junit', module: 'junit'
  }

  implementation 'org.locationtech.jts.io:jts-io-common:1.20.0'

  // parsing json
  implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.0'
  implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.15.2'

  // Graphs
  implementation 'org.jgrapht:jgrapht-core:1.5.3'

  // Statistics (for random load model)
  implementation 'de.lmu.ifi.dbs.elki:elki:0.7.5'

  // testing
  testImplementation "org.apache.groovy:groovy:$groovyBinaryVersion"
  testImplementation "org.apache.groovy:groovy-json:$groovyBinaryVersion"

  testImplementation "org.junit.platform:junit-platform-launcher:$junitVersion"
  testImplementation "org.junit.jupiter:junit-jupiter:$junitVersion"
  testImplementation "org.spockframework:spock-core:2.4-groovy-5.0"
  testImplementation 'org.objenesis:objenesis:3.6' // Mock creation with constructor parameters
  testImplementation 'net.bytebuddy:byte-buddy:1.18.12' // Mocks of classes

  // testcontainers (docker framework for testing)
  testImplementation "org.testcontainers:testcontainers:$testcontainersVersion"
  testImplementation "org.testcontainers:testcontainers-spock:$testcontainersVersion"
  testImplementation "org.testcontainers:testcontainers-influxdb:$testcontainersVersion"
  testImplementation "org.testcontainers:testcontainers-postgresql:$testcontainersVersion"
  testImplementation "org.testcontainers:testcontainers-couchbase:$testcontainersVersion"

  // logging
  implementation platform('org.apache.logging.log4j:log4j-bom:2.26.1')
  implementation 'org.apache.logging.log4j:log4j-api' // log4j
  implementation 'org.apache.logging.log4j:log4j-core' // log4j
  implementation 'org.apache.logging.log4j:log4j-slf4j-impl' // log4j -> slf4j

  // Databases
  implementation 'org.influxdb:influxdb-java:2.25'
  implementation 'com.couchbase.client:java-client:3.12.2'
  runtimeOnly 'org.postgresql:postgresql:42.7.13' // postgresql jdbc driver required during runtime

  implementation 'commons-io:commons-io:2.22.0' // I/O functionalities
  implementation 'commons-codec:commons-codec:1.22.1' // needed by commons-compress
  implementation 'org.apache.commons:commons-compress:1.28.0' // I/O functionalities

  // model generation
  codegenImplementation 'com.palantir.javapoet:javapoet:0.19.0'
  codegenImplementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.17.0'
}

tasks.withType(JavaCompile).configureEach {
  options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
  options.encoding = 'UTF-8'
  failOnError = false // TODO: Temp until JavaDoc issues are resolved
}

tasks.register('printVersion') {
  doLast {
    println project.version
  }
}

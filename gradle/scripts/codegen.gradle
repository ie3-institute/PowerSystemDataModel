def sourceSets = extensions.getByType(SourceSetContainer)

def codegen = sourceSets.create('codegen') {
  java.srcDir('src/codegen/java')
  resources.srcDir('src/codegen/resources')
}

def generatedModelDir = file("src/main/java").absolutePath

def generateModels = tasks.register('generateModels', JavaExec) {
  group = 'code generation'
  description = 'Generates some model classes from YAML definition.'

  dependsOn tasks.named(codegen.classesTaskName)

  classpath = codegen.runtimeClasspath
  mainClass = 'edu.ie3.codegen.ModelGenerator'

  args(generatedModelDir)

  doFirst {
    delete(layout.buildDirectory.dir("src/main/java"))
  }

  doLast {
    spotlessApply
  }
}

sourceSets.named('main') {
  java.srcDir(generatedModelDir)
}

tasks.named('processCodegenResources', ProcessResources) {
  duplicatesStrategy = DuplicatesStrategy.WARN
}
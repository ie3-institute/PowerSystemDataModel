                 @param rSc Short circuit resistance\n
                 @param xSc Short circuit reactance\n
                 @param sRated Rated apparent power (typically in kVA)\n
                 @param vRatedA Rated voltage of the high voltage winding\n
                 @param vRatedB Rated voltage of the low voltage winding\n
                 @param gM Phase-to-ground conductance\n

models:
  AssetInput:
    constructors:
      - name: minimal
        components: [uuid, id]
        superArgs: [uuid]
      - name: full
        components: [uuid, id, operator, operationTime]
        superArgs: [uuid]
  NodeInput:
    constructors:
      - name: minimal
        components: [uuid, id, slack, subgrid]
        superArgs: [uuid, id]
      - name: full
        components: [uuid, id, operator, operationTime, slack, subgrid]
        superArgs: [uuid, id, operator, operationTime]




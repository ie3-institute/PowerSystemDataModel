               \n
               @param uuid of the input entity\n
               @param id of the asset\n
               @param node that the asset is connected to\n
               @param qCharacteristics Description of a reactive power characteristic\n
               @param controllingEm The {@link EmInput} controlling this system participant. Null, if not applicable."

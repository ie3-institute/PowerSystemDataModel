  models.input.system.type:
    SystemParticipantTypeInput:
      classJavaDoc: "Describes the type of a {@link edu.ie3.datamodel.models.input.system.SystemParticipantInput}."
      constructors:
        - name: full
          components: [uuid, id, capex, opex, sRated, cosPhiRated]
          superArgs: [uuid, id]
          javaDoc: "@param uuid of the input entity\n
               @param id of this type of system participant\n
               @param capex Captial expense for this type of system participant (typically in €)\n
               @param opex Operating expense for this type of system participant (typically in €/MWh)\n
               @param sRated Rated apparent power\n
               @param cosPhiRated Power factor for this type of system participant"
      copyBuilderAdditionalMethods:
        - name: scale
          isAbstract: true
          javaDoc: "Scales the input entity in a way that tries to preserve proportions that are related to\n
                 power. This means that capacity, consumption etc. are scaled with the same factor. Related\n
                 properties associated with the input type (if applicable) are scaled as well.\n
                 \n
                 @param factor The factor to scale with\n
                 @return A copy builder with scaled relevant properties"
          parameters:
            - name: factor
              type: double
      nonCapitalizedGetters: [sRated]

    AcTypeInput:
      classJavaDoc: "Describes the type of {@link edu.ie3.datamodel.models.input.system.AcInput}."
      constructors:
        - name: full
          components: [uuid, id, capex, opex, sRated, cosPhiRated, pThermal]
          superArgs: [uuid, id, capex, opex, sRated, cosPhiRated]
          javaDoc: "@param uuid of the input entity\n
                 @param id of this type of AC\n
                 @param capex Capital expense for this type of AC (typically in €)\n
                 @param opex Operating expense for this type of AC (typically in €)\n
                 @param cosPhiRated Power factor for this type of AC\n
                 @param sRated Rated apparent power\n
                 @param pThermal Thermal output of the air condition, when sRated * cosPhiRated is consumed\n
                     electrically"
        - name: full
          components: [uuid, id, capex, opex, sRated, cosPhiRated, pThermal, additionalInformation]
          superArgs: [uuid, id, capex, opex, sRated, cosPhiRated]
          javaDoc: "@param uuid of the input entity\n
                 @param id of this type of AC\n
                 @param capex Capital expense for this type of AC (typically in €)\n
                 @param opex Operating expense for this type of AC (typically in €)\n
                 @param cosPhiRated Power factor for this type of AC\n
                 @param sRated Rated apparent power\n
                 @param pThermal Thermal output of the air condition, when sRated * cosPhiRated is consumed\n
                     electrically\n
                 @param additionalInformation That were provided by the source"
      copyBuilderAdditionalMethods:
        - name: scale
          isAbstract: false
          parameters:
            - name: factor
              type: double
          expression: capex(getCapex().multiply(factor)); sRated(getsRated().multiply(factor)); pThermal(getpThermal().multiply(factor))
      nonCapitalizedGetters: [pThermal, sRated]

    BmTypeInput:
      classJavaDoc: "Describes the type of {@link edu.ie3.datamodel.models.input.system.BmInput}."
      constructors:
        - name: full
          components: [uuid, id, capex, opex, activePowerGradient, sRated, cosPhiRated, etaConv]
          superArgs: [uuid, id, capex, opex, sRated, cosPhiRated]
          javaDoc: "@param uuid of the input entity\n
                 @param id of this type of BM\n
                 @param capex Capital expense for this type of BM (typically in €)\n
                 @param opex Operating expense for this type of BM (typically in €)\n
                 @param cosPhiRated Power factor for this type of BM\n
                 @param activePowerGradient Maximum permissible gradient of active power change\n
                 @param sRated Rated apparent power for this type of BM (typically in kVA)\n
                 @param etaConv Efficiency of converter for this type of BM (typically in %)"
        - name: full
          components: [uuid, id, capex, opex, activePowerGradient, sRated, cosPhiRated, etaConv, additionalInformation]
          superArgs: [uuid, id, capex, opex, sRated, cosPhiRated]
          javaDoc: "@param uuid of the input entity\n
                 @param id of this type of BM\n
                 @param capex Capital expense for this type of BM (typically in €)\n
                 @param opex Operating expense for this type of BM (typically in €)\n
                 @param cosPhiRated Power factor for this type of BM\n
                 @param activePowerGradient Maximum permissible gradient of active power change\n
                 @param sRated Rated apparent power for this type of BM (typically in kVA)\n
                 @param etaConv Efficiency of converter for this type of BM (typically in %)\n
                 @param additionalInformation That were provided by the source"
      copyBuilderAdditionalMethods:
        - name: scale

        - name: fullWithAdditionalInformation
          components: [ uuid, id, material, innerDiameter, outerDiameter, thermalResistivity, thermalCapacitance, area, wiresNumber, wireDiameter, lengthOfLay, electricalResistivity, additionalInformation]
          superArgs: [ uuid, id ]
          javaDoc: "Constructor for a screen layer.\n
                 \n
                 @param uuid UUID of the screen layer\n
                 @param id Name/designation of this screen layer\n
                 @param material Material of the screen\n
                 @param innerDiameter Inner diameter of the screen layer\n
                 @param outerDiameter Outer diameter of the screen layer\n
                 @param thermalResistivity Thermal resistivity of the material\n
                 @param thermalCapacitance Thermal capacitance of the material\n
                 @param area Optional real cross-sectional area (e.g. if different from geometry)\n
                 @param wiresNumber Number of individual wires in the screen\n
                 @param wireDiameter Diameter of an individual wire in the screen\n
                 @param lengthOfLay Optional length of lay (pitch) of the screen winding\n
                 @param electricalResistivity Electrical resistivity specific to the screen material
                 @param additionalInformation That were provided by the source"
        - name: withoutOptionalsWithAdditionalInformation
          components: [ uuid, id, material, innerDiameter, outerDiameter, thermalResistivity, thermalCapacitance, wiresNumber, wireDiameter, electricalResistivity, additionalInformation]
          superArgs: [ uuid, id ]
          javaDoc: "Constructor for a screen layer.\n
                 \n
                 @param uuid UUID of the screen layer\n
                 @param id Name/designation of this screen layer\n
                 @param material Material of the screen\n
                 @param innerDiameter Inner diameter of the screen layer\n
                 @param outerDiameter Outer diameter of the screen layer\n
                 @param thermalResistivity Thermal resistivity of the material\n
                 @param thermalCapacitance Thermal capacitance of the material\n
                 @param wiresNumber Number of individual wires in the screen\n
                 @param wireDiameter Diameter of an individual wire in the screen\n
                 @param electricalResistivity Electrical resistivity specific to the screen material
                 @param additionalInformation That were provided by the source"
          constructorModifications:
            area:
              expression: null
            lengthOfLay:
              expression: null
      fieldNameGetters: [material, innerDiameter, outerDiameter, thermalResistivity, thermalCapacitance, area, wiresNumber, wireDiameter, lengthOfLay, electricalResistivity]
      methodInserts:
        - name: name
          type: String
          expression: getId()

    Transformer2WTypeInput:
      classJavaDoc: "Describes the type of a {@link edu.ie3.datamodel.models.input.connector.Transformer2WInput}."
      constructors:
        - name: full
          components: [uuid, id, rSc, xSc, sRated, vRatedA, vRatedB, gM, bM, dV, dPhi, tapSide, tapNeutr, tapMin, tapMax]
          superArgs: [uuid, id]
          javaDoc: "@param uuid of the input entity\n

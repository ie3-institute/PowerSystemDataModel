                 @param coordinate of this weather value set\n
                 @param directSolarIrradiance Direct sun irradiance for this coordinate (typically in W/m²)\n
                 @param diffuseSolarIrradiance Diffuse sun irradiance for this coordinate (typically in W/m²)\n
                 @param temperature for this coordinate (typically in K)\n
                 @param direction Direction, the wind comes from as an angle from north increasing clockwise\n

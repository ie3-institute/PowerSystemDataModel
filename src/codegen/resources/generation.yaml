                 @param operationTime Time for which the entity is operated\n
                 @param nodeA The higher voltage node\n
                 @param nodeB The middle voltage node\n
                 @param nodeC The lower voltage node\n
                 @param parallelDevices overall amount of parallel transformers to automatically construct (e.g.\n
                     parallelDevices = 2 will build a total of two transformers using the specified parameters)\n
                 @param type of 2W transformer\n
                 @param tapPos Tap position of this transformer\n
                 @param autoTap True, if the tap position of the transformer is adapted automatically"
        constructorModifications:
          nodeInternal:
            expression: new NodeInput(UUID.randomUUID(), "internal_node_" + id, operator, operationTime, $T.getQuantity(1d, $T.PU), false, null, nodeA.getVoltLvl(), nodeA.getSubnet())

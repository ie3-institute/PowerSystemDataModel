models:
  UniqueInputEntity:
    constructors:
      - name: minimal
        components: [uuid]
        superArgs: [uuid]
    optionalGetters: []

  AssetInput:
    constructors:
      - name: minimal
        components: [uuid, id]
        superArgs: [uuid]
      - name: full
        components: [uuid, id, operator, operationTime]
        superArgs: [uuid]
    optionalGetters: []

  NodeInput:
    constructors:
      - name: minimal
        components: [uuid, id, slack, subgrid]
        superArgs: [uuid, id]
      - name: full
        components: [uuid, id, operator, operationTime, slack, subgrid]
        superArgs: [uuid, id, operator, operationTime]
    staticFields:
      - name: DEFAULT_GEO_POSITION
        type: Point
        expression: buildPoint(51.4843281, 7.4116482)
        className: GeoUtils

    optionalGetters: []
    fromMap: true
    fromMapConstructor: full
    resolverOrder: [operator]



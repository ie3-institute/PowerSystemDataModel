models:
  UniqueEntity:
    classJavaDoc: "Supplies every subclass with a generated UUID, making it unique."
    inherits: [Entity, Uniqueness, Serializable]
    constructors:
      - name: minimal
        components: []
      - name: full
        components: [uuid]

  UniqueInputEntity:
    classJavaDoc: "Functionless class to describe that all subclasses are unique input classes."
    inherits: [InputEntity]
    constructors:
      - name: minimal
        components: [uuid]
        superArgs: [uuid]

  AssetInput:
    classJavaDoc: "Describes a grid asset under the assumption that every asset could be operable."
    inherits: [Operable]
    constructors:
      - name: full
        components: [uuid, id, operator, operationTime]
        superArgs: [uuid]
        javaDoc: "Constructor for an asset with timely limited operation and specific operator.\n
                 \n
                 @param uuid Unique identifier\n
                 @param id Human-readable identifier\n
                 @param operator Operator of the asset\n
                 @param operationTime Operation time limitation"
      - name: minimal
        components: [uuid, id]
        superArgs: [uuid]
        javaDoc: "Constructor for an asset with timely unlimited operation and unassigned operator.\n
                 \n
                 @param uuid Unique identifier\n
                 @param id Human-readable identifier"

  AssetTypeInput:
    classJavaDoc: "Describes the type of {@link edu.ie3.datamodel.models.input.AssetInput}."
    constructors:
      - name: full
        components: [uuid, id]
        superArgs: [uuid]
        javaDoc: "@param uuid of the input entity\n
                @param id of the asset"

  NodeInput:
    classJavaDoc: "Describes an electrical grid node, that other assets can connect to."
    constructors:
      - name: full
        components: [uuid, id, operator, operationTime, vTarget, slack, geoPosition, voltLvl, subnet]
        superArgs: [uuid, id, operator, operationTime]
        javaDoc: "Constructor for an operated node.\n
                 \n
                 @param uuid of the input entity\n
                 @param id of the asset\n
                 @param operator of the asset\n
                 @param operationTime Time for which the entity is operated\n
                 @param vTarget Target voltage magnitude of the node with regard to its rated voltage\n
                 @param slack Is this node a slack node?\n
                 @param geoPosition Coordinates of this node, especially relevant for geo-dependant systems,
                     that are connected to this node\n
                 @param voltLvl Voltage level of this node\n
                 @param subnet of this node"
      - name: fullWithAdditionalInformation
        components: [ uuid, id, operator, operationTime, vTarget, slack, geoPosition, voltLvl, subnet, additionalInformation ]
        superArgs: [ uuid, id, operator, operationTime ]
        javaDoc: "Constructor for an operated node.\n
                \n
                @param uuid of the input entity\n
                @param id of the asset\n
                @param operator of the asset\n
                @param operationTime Time for which the entity is operated\n
                @param vTarget Target voltage magnitude of the node with regard to its rated voltage\n
                @param slack Is this node a slack node?\n
                @param geoPosition Coordinates of this node, especially relevant for geo-dependant systems,
                    that are connected to this node\n
                @param voltLvl Voltage level of this node\n
                @param subnet of this node\n
                @param additionalInformation That were provided by the source"
      - name: minimal
        components: [ uuid, id, vTarget, slack, geoPosition, voltLvl, subnet ]
        superArgs: [ uuid, id ]
        javaDoc: "Constructor for an operated node.\n
                 \n
                 @param uuid of the input entity\n
                 @param id of the asset\n
                 @param vTarget Target voltage magnitude of the node with regard to its rated voltage\n
                 @param slack Is this node a slack node?\n
                 @param geoPosition Coordinates of this node, especially relevant for geo-dependant systems,
                     that are connected to this node\n
                 @param voltLvl Voltage level of this node\n
                 @param subnet of this node"
    staticFields:
      - name: DEFAULT_GEO_POSITION
        type: Point
        expression: buildPoint(51.4843281, 7.4116482)
        className: GeoUtils
        javaDoc: "Use this default value if geoPosition is unknown."
    getterOptions:
      vTarget:
        capitalize: false
    fromMap: false
    fromMapConstructor: full
    resolverOrder: [operator]

  OperatorInput:
    classJavaDoc: "Describes an operator, that operates assets."
    constructors:
      - name: minimal
        components: [uuid, id]
        superArgs: [uuid]
        javaDoc: "Constructor for an Operator.\n
                 \n
                 @param uuid Unique identifier\n
                 @param id Human readable identifier"
      - name: withAdditionalInformation
        components: [uuid, id, additionalInformation]
        superArgs: [uuid]
        javaDoc: "Constructor for an Operator.\n
                 \n
                 @param uuid Unique identifier\n
                 @param id Human readable identifier\n
                 @param additionalInformation That were provided by the source"
    staticFields:
      - name: NO_OPERATOR_ASSIGNED
        type: OperatorInput
        expression: new OperatorInput(UUID.randomUUID(), "NO_OPERATOR_ASSIGNED")
    fromMap: true
    fromMapConstructor: minimal

  MeasurementUnitInput:
    classJavaDoc: "Model of a measuring unit attached to a certain {@link NodeInput}."
    inherits: [HasNodes]
    constructors:
      - name: full
        components: [uuid, id, operator, operationTime, node, vMag, vAng, p, q]
        superArgs: [uuid, id, operator, operationTime]
        javaDoc: "Constructor for an operated measurement unit.\n
                 \n
                 @param uuid of the input entity\n
                 @param id of the asset\n
                 @param operator of the asset\n
                 @param operationTime Time for which the entity is operated\n
                 @param node Grid node, the asset is attached to\n
                 @param vMag True, if the voltage magnitude is measured\n
                 @param vAng True, if the voltage angle is measured\n
                 @param p True, if the nodal residual active power is measured\n
                 @param q True, if the reactive power is measured"
      - name: fullWithAdditionalInformation
        components: [ uuid, id, operator, operationTime, node, vMag, vAng, p, q, additionalInformation ]
        superArgs: [ uuid, id, operator, operationTime ]
        javaDoc: "Constructor for an operated measurement unit.\n
                 \n
                 @param uuid of the input entity\n
                 @param id of the asset\n
                 @param operator of the asset\n
                 @param operationTime Time for which the entity is operated\n
                 @param node Grid node, the asset is attached to\n
                 @param vMag True, if the voltage magnitude is measured\n
                 @param vAng True, if the voltage angle is measured\n
                 @param p True, if the nodal residual active power is measured\n
                 @param q True, if the reactive power is measured\n
                 @param additionalInformation That were provided by the source"
      - name: minimal
        components: [uuid, id, node, vMag, vAng, p, q]
        superArgs: [uuid, id]
        javaDoc: "Constructor for an operated measurement unit.\n
                 \n
                 @param uuid of the input entity\n
                 @param id of the asset\n
                 @param node Grid node, the asset is attached to\n
                 @param vMag True, if the voltage magnitude is measured\n
                 @param vAng True, if the voltage angle is measured\n
                 @param p True, if the nodal residual active power is measured\n
                 @param q True, if the reactive power is measured"
    fromMap: true
    fromMapConstructor: full
    resolverOrder: [operator, node]
    methodOverrides:
      - name: allNodes
        type: NodeList
        expression: singletonList(node)
        className: Collections

  EmInput:
    classJavaDoc: "Describes the type of {@link edu.ie3.datamodel.models.input.AssetInput}."
    inherits: [HasEm]
    constructors:
      - name: full
        components: [uuid, id, operator, operationTime, controlStrategy, controllingEm]
        superArgs: [uuid, id, operator, operationTime]
        javaDoc: "Constructor for an operated energy management system.\n
                 \n
                 @param uuid of the input entity\n
                 @param id of the asset\n
                 @param operator of the asset\n
                 @param operationTime time for which the entity is operated\n
                 @param controlStrategy the control strategy\n
                 @param controllingEm The {@link EmInput} controlling this em unit. Null, if not applicable."
      - name: fullWithAdditionalInformation
        components: [uuid, id, operator, operationTime, controlStrategy, controllingEm, additionalInformation]
        superArgs: [uuid, id, operator, operationTime]
        javaDoc: "Constructor for an operated energy management system.\n
                 \n
                 @param uuid of the input entity\n
                 @param id of the asset\n
                 @param operator of the asset\n
                 @param operationTime time for which the entity is operated\n
                 @param controlStrategy the control strategy\n
                 @param controllingEm The {@link EmInput} controlling this em unit. Null, if not applicable.\n
                 @param additionalInformation That were provided by the source"
      - name: minimal
        components: [uuid, id, controlStrategy, controllingEm]
        superArgs: [uuid, id]
        javaDoc: "Constructor for an operated energy management system.\n
                 \n
                 @param uuid of the input entity\n
                 @param id of the asset\n
                 @param controlStrategy the control strategy\n
                 @param controllingEm The {@link EmInput} controlling this em unit. Null, if not applicable."
    getterOptions:
      controllingEm:
        optional: true

  ConnectorInput:
    classJavaDoc: "Describes an asset that connects two {@link NodeInput}s."
    inherits: [HasNodes]
    constructors:
      - name: full
        components: [uuid, id, operator, operationTime, nodeA, nodeB, parallelDevices]
        superArgs: [uuid, id, operator, operationTime]
        javaDoc: "Constructor for an operated connector.\n
               \n
               @param uuid of the input entity\n
               @param id of the asset\n
               @param operator of the asset\n
               @param operationTime Time for which the entity is operated\n
               @param nodeA Grid node at one side of the connector\n
               @param nodeB Grid node at the other side of the connector\n
               @param parallelDevices overall amount of parallel devices to automatically construct (e.g.\n
                   parallelDevices = 2 will build a total of two entities using the specified parameters)"
      - name: minimal
        components: [uuid, id, nodeA, nodeB, parallelDevices]
        superArgs: [uuid, id]
        javaDoc: "Constructor for an operated connector.\n
               \n
               @param uuid of the input entity\n
               @param id of the asset\n
               @param nodeA Grid node at one side of the connector\n
               @param nodeB Grid node at the other side of the connector\n
               @param parallelDevices overall amount of parallel devices to automatically construct (e.g.\n
                   parallelDevices = 2 will build a total of two entities using the specified parameters)"
    methodOverrides:
      - name: allNodes
        type: NodeList
        expression: of(getNodeA(), getNodeB())
        className: List

  LineInput:
    classJavaDoc: "Describes an electrical grid line that connects two {@link NodeInput}s."
    inherits: [HasType]
    constructors:
      - name: full
        components: [uuid, id, operator, operationTime, nodeA, nodeB, parallelDevices, type, length, geoPosition, olmCharacteristic]
        superArgs: [uuid, id, operator, operationTime, nodeA, nodeB, parallelDevices]
        javaDoc: "Constructor for an operated line.\n
               \n
               @param uuid of the input entity\n
               @param id of the asset\n
               @param operator of the asset\n
               @param operationTime Time for which the entity is operated\n
               @param nodeA Grid node at one side of the line\n
               @param nodeB Grid node at the other side of the line\n
               @param parallelDevices overall amount of parallel lines to automatically construct (e.g.\n
                   parallelDevices = 2 will build a total of two lines using the specified parameters)\n
               @param type of line\n
               @param length of this line\n
               @param geoPosition Coordinates of this line\n
               @param olmCharacteristic Description of an optional weather dependent operation curve"
      - name: fullWithAdditionalInformation
        components: [uuid, id, operator, operationTime, nodeA, nodeB, parallelDevices, type, length, geoPosition, olmCharacteristic, additionalInformation]
        superArgs: [uuid, id, operator, operationTime, nodeA, nodeB, parallelDevices]
        javaDoc: "Constructor for an operated line.\n
               \n
               @param uuid of the input entity\n
               @param id of the asset\n
               @param operator of the asset\n
               @param operationTime Time for which the entity is operated\n
               @param nodeA Grid node at one side of the line\n
               @param nodeB Grid node at the other side of the line\n
               @param parallelDevices overall amount of parallel lines to automatically construct (e.g.\n
                   parallelDevices = 2 will build a total of two lines using the specified parameters)\n
               @param type of line\n
               @param length of this line\n
               @param geoPosition Coordinates of this line\n
               @param olmCharacteristic Description of an optional weather dependent operation curve\n
               @param additionalInformation That were provided by the source"
      - name: minimal
        components: [uuid, id, nodeA, nodeB, parallelDevices, type, length, geoPosition, olmCharacteristic]
        superArgs: [uuid, id, nodeA, nodeB, parallelDevices]
        javaDoc: "Constructor for an operated line.\n
               \n
               @param uuid of the input entity\n
               @param id of the asset\n
               @param nodeA Grid node at one side of the line\n
               @param nodeB Grid node at the other side of the line\n
               @param parallelDevices overall amount of parallel lines to automatically construct (e.g.\n
                   parallelDevices = 2 will build a total of two lines using the specified parameters)\n
               @param type of line\n
               @param length of this line\n
               @param geoPosition Coordinates of this line\n
               @param olmCharacteristic Description of an optional weather dependent operation curve"
    constructorModifications:
      geoPosition:
        expression: buildSafeLineString(geoPosition)
        className: GeoUtils
      length:
        expression: length.to($T.LINE_LENGTH)
        className: StandardUnits
        insert: true















  models.value.load:
    RandomLoadValues:
      classJavaDoc: "Data model to describe the parameters of a probability density function to draw random power\n
                 consumptions. This model represents a generalized extreme value distribution (GEV), that has been\n
                 sampled for each quarter-hour of a day, subdivided into workdays, Saturdays and Sundays. In\n
                 general the GEV is described by the three parameters \"location\", \"scale\" and \"shape\"."
      inherits: [LoadValues, RandomNumberProvider]
      constructors:
        - name: full
          components: [kSa, kSu, kWd, mySa, mySu, myWd, sigmaSa, sigmaSu, sigmaWd]
          javaDoc: "@param kSa Shape parameter for a Saturday\n
                 @param kSu Shape parameter for a Sunday\n
                 @param kWd Shape parameter for a working day\n
                 @param mySa Location parameter for a Saturday\n
                 @param mySu Location parameter for a Sunday\n
                 @param myWd Location parameter for a working day\n
                 @param sigmaSa Scale parameter for a Saturday\n
                 @param sigmaSu Scale parameter for a Sunday\n
                 @param sigmaWd Scale parameter for a working day"
          constructorModifications:
            gevWd:
              expression: new GeneralizedExtremeValueDistribution(myWd, sigmaWd, kWd, factory.getRandom())
            gevSa:
              expression: new GeneralizedExtremeValueDistribution(mySa, sigmaSa, kSa, factory.getRandom())
            gevSu:
              expression: new GeneralizedExtremeValueDistribution(mySu, sigmaSu, kSu, factory.getRandom())
      copy: false
      excludeFromMethods: [gevWd, gevSa, gevSu]
      methodOverrides:
        - name: getValue
          type: PValue
          parameters:
            - name: time
              type: ZonedDateTime
            - name: powerProfileKey
              type: PowerProfileKey
          expression: new PValue($T.getQuantity(getValue(time.getDayOfWeek()), $T.KILOWATT))
          className: Quantities
          unitClass: PowerSystemUnits
      methodInserts:
        - name: getValue
          type: double
          annotation: false
          private: true
          explicitReturn: false
          parameters:
            - name: day
              type: DayOfWeek
          expression: "double randomValue =\n
                          switch (day) {\n
                            case SATURDAY -> gevSa.nextRandom();\n
                            case SUNDAY -> gevSu.nextRandom();\n
                            default -> gevWd.nextRandom();\n
                          };\n
                      \n
                      while (randomValue < 0) {\n
                        randomValue = getValue(day);\n
                      }\n
                      return randomValue"

    BdewLoadValues:
      classJavaDoc: "Load values for a {@link edu.ie3.datamodel.models.profile.BdewStandardLoadProfile}."
      inherits: [LoadValues]
      sealed: true
      copy: false
      additionalFields:
        - name: values
          type: StringDoubleMap
          protected: true
          transient: true
          expression: new $T<>()
          className: HashMap
          insert: true
      methodInserts:
        - name: getValue
          type: PValue
          parameters:
            - name: time
              type: ZonedDateTime
            - name: powerProfileKey
              type: PowerProfileKey
          expression: "return $T.dynamization(powerProfileKey, getPower(time), time.getDayOfYear()); // leap years are ignored"
          explicitReturn: false
          className: BdewStandardLoadProfile
        - name: getPower
          type: double
          protected: true
          parameters:
            - name: time
              type: ZonedDateTime
          abstract: true
        - name: getMaxValue
          type: double
          parameters:
            - name: lastDayOfYear
              type: bool
          javaDoc: "Method to calculate the maximal value contained in this {@link BdewLoadValues}.\n
                 \n
                 @param lastDayOfYear if true, only the values, that could occur at the last day of a year, are\n
                     considered\n
                 @return the maximal value"
          abstract: true

    Bdew1999:
      static: true
      final: true
      constructors:
        - name: full
          components: [suSa, suSu, suWd, trSa, trSu, trWd, wiSa, wiSu, wiWd]
          superArgs: []
          valuesMap: values
      copy: false
      methodOverrides:
        - name: getPower
          type: double
          protected: true
          parameters:
            - name: time
              type: ZonedDateTime
          expression: "String key = $T.getSeason(time).getKey().toLowerCase();\n
                    switch (time.getDayOfWeek()) {\n
                      case SATURDAY -> key += \"Sa\";\n
                      case SUNDAY -> key += \"Su\";\n
                      default -> key += \"Wd\";\n
                    }\n
                    \n
                    return values.get(key)"
          className: BdewSeason
        - name: getMaxValue
          type: double
          parameters:
            - name: lastDayOfYear
              type: bool
          expression: "$T stream;\n
                    \n
                    if (lastDayOfYear) {\n
                      stream = DoubleStream.of(wiSa, wiSu, wiWd);\n
                    } else {\n
                      stream = values.values().stream().mapToDouble(d -> d);\n
                    }\n
                    \n
                    return stream.max().orElse(0.0)"
          className: DoubleStream

    Bdew2025:
      static: true
      final: true
      constructors:
        - name: full
          components: [janSa, janSu, janWd, febSa, febSu, febWd, marSa, marSu, marWd, aprSa, aprSu, aprWd, maySa, maySu, mayWd, junSa, junSu, junWd, julSa, julSu, julWd, augSa, augSu, augWd, sepSa, sepSu, sepWd, octSa, octSu, octWd, novSa, novSu, novWd, decSa, decSu, decWd]
          superArgs: []
          valuesMap: values
      copy: false
      methodOverrides:
        - name: getPower
          type: double
          protected: true
          parameters:
            - name: time
              type: ZonedDateTime
          expression: "String key = time.getMonth().toString().substring(0, 2).toLowerCase();\n
                    switch (time.getDayOfWeek()) {\n
                      case SATURDAY -> key += \"Sa\";\n
                      case SUNDAY -> key += \"Su\";\n
                      default -> key += \"Wd\";\n
                    }\n
                    \n
                    return values.get(key)"
        - name: getMaxValue
          type: double
          parameters:
            - name: lastDayOfYear
              type: bool
          expression: "$T stream;\n
                    \n
                    if (lastDayOfYear) {\n
                      stream = DoubleStream.of(decSa, decSu, decWd);\n
                    } else {\n
                      stream = values.values().stream().mapToDouble(d -> d);\n
                    }\n
                    \n
                    return stream.max().orElse(0.0)"
          className: DoubleStream

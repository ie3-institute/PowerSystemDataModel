models:
  UniqueEntity:
    classJavaDoc: "Supplies every subclass with a generated UUID, making it unique."
    inherits: [Entity, Uniqueness, Serializable]
    constructors:
      - name: minimal
        components: []
      - name: full
        components: [uuid]

  UniqueInputEntity:
    classJavaDoc: "Functionless class to describe that all subclasses are unique input classes."
    inherits: [InputEntity]
    constructors:
      - name: minimal
        components: [uuid]
        superArgs: [uuid]

  AssetInput:
    classJavaDoc: "Describes a grid asset under the assumption that every asset could be operable."
    inherits: [Operable]
    constructors:
      - name: full
        components: [uuid, id, operator, operationTime]
        superArgs: [uuid]
        javaDoc: "Constructor for an asset with timely limited operation and specific operator.\n
                 \n
                 @param uuid Unique identifier\n
                 @param id Human-readable identifier\n
                 @param operator Operator of the asset\n
                 @param operationTime Operation time limitation"
      - name: minimal
        components: [uuid, id]
        superArgs: [uuid]
        javaDoc: "Constructor for an asset with timely unlimited operation and unassigned operator.\n
                 \n
                 @param uuid Unique identifier\n
                 @param id Human-readable identifier"

  AssetTypeInput:
    classJavaDoc: "Describes the type of {@link edu.ie3.datamodel.models.input.AssetInput}."
    constructors:
      - name: full
        components: [uuid, id]
        superArgs: [uuid]
        javaDoc: "@param uuid of the input entity\n
                @param id of the asset"

  NodeInput:
    classJavaDoc: "Describes an electrical grid node, that other assets can connect to."
    constructors:
      - name: full
        components: [uuid, id, operator, operationTime, vTarget, slack, geoPosition, voltLvl, subnet]
        superArgs: [uuid, id, operator, operationTime]
        javaDoc: "Constructor for an operated node.\n
                 \n
                 @param uuid of the input entity\n
                 @param id of the asset\n
                 @param operator of the asset\n
                 @param operationTime Time for which the entity is operated\n
                 @param vTarget Target voltage magnitude of the node with regard to its rated voltage\n
                 @param slack Is this node a slack node?\n
                 @param geoPosition Coordinates of this node, especially relevant for geo-dependant systems,
                     that are connected to this node\n
                 @param voltLvl Voltage level of this node\n
                 @param subnet of this node"
      - name: fullWithAdditionalInformation
        components: [ uuid, id, operator, operationTime, vTarget, slack, geoPosition, voltLvl, subnet, additionalInformation ]
        superArgs: [ uuid, id, operator, operationTime ]
        javaDoc: "Constructor for an operated node.\n
                \n
                @param uuid of the input entity\n
                @param id of the asset\n
                @param operator of the asset\n
                @param operationTime Time for which the entity is operated\n
                @param vTarget Target voltage magnitude of the node with regard to its rated voltage\n
                @param slack Is this node a slack node?\n
                @param geoPosition Coordinates of this node, especially relevant for geo-dependant systems,
                    that are connected to this node\n
                @param voltLvl Voltage level of this node\n
                @param subnet of this node\n
                @param additionalInformation That were provided by the source"
      - name: minimal
        components: [ uuid, id, vTarget, slack, geoPosition, voltLvl, subnet ]
        superArgs: [ uuid, id ]
        javaDoc: "Constructor for an operated node.\n
                 \n
                 @param uuid of the input entity\n
                 @param id of the asset\n
                 @param vTarget Target voltage magnitude of the node with regard to its rated voltage\n
                 @param slack Is this node a slack node?\n
                 @param geoPosition Coordinates of this node, especially relevant for geo-dependant systems,
                     that are connected to this node\n
                 @param voltLvl Voltage level of this node\n
                 @param subnet of this node"
    staticFields:
      - name: DEFAULT_GEO_POSITION
        type: Point
        expression: buildPoint(51.4843281, 7.4116482)
        className: GeoUtils
        javaDoc: "Use this default value if geoPosition is unknown."
    nonCapitalizedGetters: [vTarget]

  OperatorInput:
    classJavaDoc: "Describes an operator, that operates assets."
    constructors:
      - name: minimal
        components: [uuid, id]
        superArgs: [uuid]
        javaDoc: "Constructor for an Operator.\n
                 \n
                 @param uuid Unique identifier\n
                 @param id Human readable identifier"
      - name: withAdditionalInformation
        components: [uuid, id, additionalInformation]
        superArgs: [uuid]
        javaDoc: "Constructor for an Operator.\n
                 \n
                 @param uuid Unique identifier\n
                 @param id Human readable identifier\n
                 @param additionalInformation That were provided by the source"
    staticFields:
      - name: NO_OPERATOR_ASSIGNED
        type: OperatorInput
        expression: new OperatorInput(UUID.randomUUID(), "NO_OPERATOR_ASSIGNED")

  MeasurementUnitInput:
    classJavaDoc: "Model of a measuring unit attached to a certain {@link NodeInput}."
    inherits: [HasNodes]
    constructors:
      - name: full
        components: [uuid, id, operator, operationTime, node, vMag, vAng, p, q]
        superArgs: [uuid, id, operator, operationTime]
        javaDoc: "Constructor for an operated measurement unit.\n
                 \n
                 @param uuid of the input entity\n
                 @param id of the asset\n
                 @param operator of the asset\n
                 @param operationTime Time for which the entity is operated\n
                 @param node Grid node, the asset is attached to\n
                 @param vMag True, if the voltage magnitude is measured\n
                 @param vAng True, if the voltage angle is measured\n
                 @param p True, if the nodal residual active power is measured\n
                 @param q True, if the reactive power is measured"
      - name: fullWithAdditionalInformation
        components: [ uuid, id, operator, operationTime, node, vMag, vAng, p, q, additionalInformation ]
        superArgs: [ uuid, id, operator, operationTime ]
        javaDoc: "Constructor for an operated measurement unit.\n
                 \n
                 @param uuid of the input entity\n
                 @param id of the asset\n
                 @param operator of the asset\n
                 @param operationTime Time for which the entity is operated\n
                 @param node Grid node, the asset is attached to\n
                 @param vMag True, if the voltage magnitude is measured\n
                 @param vAng True, if the voltage angle is measured\n
                 @param p True, if the nodal residual active power is measured\n
                 @param q True, if the reactive power is measured\n
                 @param additionalInformation That were provided by the source"
      - name: minimal
        components: [uuid, id, node, vMag, vAng, p, q]
        superArgs: [uuid, id]
        javaDoc: "Constructor for an operated measurement unit.\n
                 \n
                 @param uuid of the input entity\n
                 @param id of the asset\n
                 @param node Grid node, the asset is attached to\n
                 @param vMag True, if the voltage magnitude is measured\n
                 @param vAng True, if the voltage angle is measured\n
                 @param p True, if the nodal residual active power is measured\n
                 @param q True, if the reactive power is measured"
    methodOverrides:
      - name: allNodes
        type: NodeList
        expression: singletonList(node)
        className: Collections

  EmInput:
    classJavaDoc: "Describes the type of {@link edu.ie3.datamodel.models.input.AssetInput}."
    inherits: [HasEm]
    constructors:
      - name: full
        components: [uuid, id, operator, operationTime, controlStrategy, controllingEm]
        superArgs: [uuid, id, operator, operationTime]
        javaDoc: "Constructor for an operated energy management system.\n
                 \n
                 @param uuid of the input entity\n
                 @param id of the asset\n
                 @param operator of the asset\n
                 @param operationTime time for which the entity is operated\n
                 @param controlStrategy the control strategy\n
                 @param controllingEm The {@link EmInput} controlling this em unit. Null, if not applicable."
      - name: fullWithAdditionalInformation
        components: [uuid, id, operator, operationTime, controlStrategy, controllingEm, additionalInformation]
        superArgs: [uuid, id, operator, operationTime]
        javaDoc: "Constructor for an operated energy management system.\n
                 \n
                 @param uuid of the input entity\n
                 @param id of the asset\n
                 @param operator of the asset\n
                 @param operationTime time for which the entity is operated\n
                 @param controlStrategy the control strategy\n
                 @param controllingEm The {@link EmInput} controlling this em unit. Null, if not applicable.\n
                 @param additionalInformation That were provided by the source"
      - name: minimal
        components: [uuid, id, controlStrategy, controllingEm]
        superArgs: [uuid, id]
        javaDoc: "Constructor for an operated energy management system.\n
                 \n
                 @param uuid of the input entity\n
                 @param id of the asset\n
                 @param controlStrategy the control strategy\n
                 @param controllingEm The {@link EmInput} controlling this em unit. Null, if not applicable."
    optionalGetters: [controllingEm]

  ConnectorInput:
    classJavaDoc: "Describes an asset that connects two {@link NodeInput}s."
    inherits: [HasNodes]
    constructors:
      - name: full
        components: [uuid, id, operator, operationTime, nodeA, nodeB, parallelDevices]
        superArgs: [uuid, id, operator, operationTime]
        javaDoc: "Constructor for an operated connector.\n
               \n
               @param uuid of the input entity\n
               @param id of the asset\n
               @param operator of the asset\n
               @param operationTime Time for which the entity is operated\n
               @param nodeA Grid node at one side of the connector\n
               @param nodeB Grid node at the other side of the connector\n
               @param parallelDevices overall amount of parallel devices to automatically construct (e.g.\n
                   parallelDevices = 2 will build a total of two entities using the specified parameters)"
      - name: fullOneConnector
        components: [uuid, id, operator, operationTime, nodeA, nodeB]
        superArgs: [uuid, id, operator, operationTime]
        javaDoc: "Constructor for an operated connector with no parallel devices (parallelDevices=1).\n
               \n
               @param uuid of the input entity\n
               @param id of the asset\n
               @param operator of the asset\n
               @param operationTime Time for which the entity is operated\n
               @param nodeA Grid node at one side of the connector\n
               @param nodeB Grid node at the other side of the connector\n"
        constructorModifications:
          parallelDevices:
            expression: 1
      - name: minimal
        components: [uuid, id, nodeA, nodeB, parallelDevices]
        superArgs: [uuid, id]
        javaDoc: "Constructor for an operated connector.\n
               \n
               @param uuid of the input entity\n
               @param id of the asset\n
               @param nodeA Grid node at one side of the connector\n
               @param nodeB Grid node at the other side of the connector\n
               @param parallelDevices overall amount of parallel devices to automatically construct (e.g.\n
                   parallelDevices = 2 will build a total of two entities using the specified parameters)"
      - name: minimalOneConnector
        components: [uuid, id, nodeA, nodeB]
        superArgs: [uuid, id]
        javaDoc: "Constructor for an operated connector with no parallel devices (parallelDevices=1).\n
               \n
               @param uuid of the input entity\n
               @param id of the asset\n
               @param nodeA Grid node at one side of the connector\n
               @param nodeB Grid node at the other side of the connector\n"
        constructorModifications:
          parallelDevices:
            expression: 1
    methodOverrides:
      - name: allNodes
        type: NodeList
        expression: of(getNodeA(), getNodeB())
        className: List

  LineInput:
    classJavaDoc: "Describes an electrical grid line that connects two {@link NodeInput}s."
    inherits: [HasType]
    constructors:
      - name: full
        components: [uuid, id, operator, operationTime, nodeA, nodeB, parallelDevices, type, length, geoPosition, olmCharacteristic]
        superArgs: [uuid, id, operator, operationTime, nodeA, nodeB, parallelDevices]
        javaDoc: "Constructor for an operated line.\n
               \n
               @param uuid of the input entity\n
               @param id of the asset\n
               @param operator of the asset\n
               @param operationTime Time for which the entity is operated\n
               @param nodeA Grid node at one side of the line\n
               @param nodeB Grid node at the other side of the line\n
               @param parallelDevices overall amount of parallel lines to automatically construct (e.g.\n
                   parallelDevices = 2 will build a total of two lines using the specified parameters)\n
               @param type of line\n
               @param length of this line\n
               @param geoPosition Coordinates of this line\n
               @param olmCharacteristic Description of an optional weather dependent operation curve"
        constructorModifications:
          geoPosition:
            expression: buildSafeLineString(geoPosition)
            className: GeoUtils
          length:
            expression: length.to($T.LINE_LENGTH)
            className: StandardUnits
            insert: true
      - name: fullWithAdditionalInformation
        components: [uuid, id, operator, operationTime, nodeA, nodeB, parallelDevices, type, length, geoPosition, olmCharacteristic, additionalInformation]
        superArgs: [uuid, id, operator, operationTime, nodeA, nodeB, parallelDevices]
        javaDoc: "Constructor for an operated line.\n
               \n
               @param uuid of the input entity\n
               @param id of the asset\n
               @param operator of the asset\n
               @param operationTime Time for which the entity is operated\n
               @param nodeA Grid node at one side of the line\n
               @param nodeB Grid node at the other side of the line\n
               @param parallelDevices overall amount of parallel lines to automatically construct (e.g.\n
                   parallelDevices = 2 will build a total of two lines using the specified parameters)\n
               @param type of line\n
               @param length of this line\n
               @param geoPosition Coordinates of this line\n
               @param olmCharacteristic Description of an optional weather dependent operation curve\n
               @param additionalInformation That were provided by the source"
        constructorModifications:
          geoPosition:
            expression: buildSafeLineString(geoPosition)
            className: GeoUtils
          length:
            expression: length.to($T.LINE_LENGTH)
            className: StandardUnits
            insert: true
      - name: minimal
        components: [uuid, id, nodeA, nodeB, parallelDevices, type, length, geoPosition, olmCharacteristic]
        superArgs: [uuid, id, nodeA, nodeB, parallelDevices]
        javaDoc: "Constructor for an operated line.\n
               \n
               @param uuid of the input entity\n
               @param id of the asset\n
               @param nodeA Grid node at one side of the line\n
               @param nodeB Grid node at the other side of the line\n
               @param parallelDevices overall amount of parallel lines to automatically construct (e.g.\n
                   parallelDevices = 2 will build a total of two lines using the specified parameters)\n
               @param type of line\n
               @param length of this line\n
               @param geoPosition Coordinates of this line\n
               @param olmCharacteristic Description of an optional weather dependent operation curve"
        constructorModifications:
          geoPosition:
            expression: buildSafeLineString(geoPosition)
            className: GeoUtils
          length:
            expression: length.to($T.LINE_LENGTH)
            className: StandardUnits
            insert: true

  LineTypeInput:
    classJavaDoc: "Describes the type of {@link edu.ie3.datamodel.models.input.connector.LineInput}."
    constructors:
      - name: full
        components: [uuid, id, b, g, r, x, iMax, vRated]
        superArgs: [uuid, id]
        javaDoc: "@param uuid of the input entity\n
               @param id of this type\n
               @param b Specific phase-to-ground susceptance for this type of line (typically in µS/km)\n
               @param g Specific phase-to-ground conductance for this type of line (typically in µS/km)\n
               @param r Specific resistance for this type of line (typically in Ohm/km)\n
               @param x Specific reactance for this type of line (typically in Ohm/km)\n
               @param iMax Maximum thermal current for this type of line (typically in A)\n
               @param vRated Rated voltage for this type of line"
        constructorModifications:
          r:
            expression: r.to($T.RESISTANCE_PER_LENGTH)
            className: StandardUnits
            insert: true
          x:
            expression: x.to($T.REACTANCE_PER_LENGTH)
            className: StandardUnits
            insert: true
          b:
            expression: b.to($T.SUSCEPTANCE_PER_LENGTH)
            className: StandardUnits
            insert: true
          g:
            expression: g.to($T.CONDUCTANCE_PER_LENGTH)
            className: StandardUnits
            insert: true
          iMax:
            expression: iMax.to($T.ELECTRIC_CURRENT_MAGNITUDE)
            className: StandardUnits
            insert: true
          vRated:
            expression: vRated.to($T.RATED_VOLTAGE_MAGNITUDE)
            className: StandardUnits
            insert: true
      - name: fullWithAdditionalInformation
        components: [uuid, id, b, g, r, x, iMax, vRated, additionalInformation]
        superArgs: [uuid, id]
        javaDoc: "@param uuid of the input entity\n
               @param id of this type\n
               @param b Specific phase-to-ground susceptance for this type of line (typically in µS/km)\n
               @param g Specific phase-to-ground conductance for this type of line (typically in µS/km)\n
               @param r Specific resistance for this type of line (typically in Ohm/km)\n
               @param x Specific reactance for this type of line (typically in Ohm/km)\n
               @param iMax Maximum thermal current for this type of line (typically in A)\n
               @param vRated Rated voltage for this type of line"
        constructorModifications:
          r:
            expression: r.to($T.RESISTANCE_PER_LENGTH)
            className: StandardUnits
            insert: true
          x:
            expression: x.to($T.REACTANCE_PER_LENGTH)
            className: StandardUnits
            insert: true
          b:
            expression: b.to($T.SUSCEPTANCE_PER_LENGTH)
            className: StandardUnits
            insert: true
          g:
            expression: g.to($T.CONDUCTANCE_PER_LENGTH)
            className: StandardUnits
            insert: true

          iMax:
            expression: iMax.to($T.ELECTRIC_CURRENT_MAGNITUDE)
            className: StandardUnits
            insert: true
          vRated:
            expression: vRated.to($T.RATED_VOLTAGE_MAGNITUDE)
            className: StandardUnits
            insert: true
    nonCapitalizedGetters: [iMax, vRated]

  SwitchInput:
    classJavaDoc: "Describes an electrical grid switch between two {@link NodeInput}s."
    constructors:
      - name: full
        components: [uuid, id, operator, operationTime, nodeA, nodeB, closed]
        superArgs: [uuid, id, operator, operationTime, nodeA, nodeB]
        javaDoc: "Constructor for an operated switch.\n
                 \n
                 @param uuid of the input entity\n
                 @param id of the asset\n
                 @param operator of the asset\n
                 @param operationTime Time for which the entity is operated\n
                 @param nodeA Grid node at one side of the switch\n
                 @param nodeB Grid node at the other side of the switch\n
                 @param closed Is the switching state 'closed'?"
      - name: fullWithAdditionalInformation
        components: [uuid, id, operator, operationTime, nodeA, nodeB, closed, additionalInformation]
        superArgs: [uuid, id, operator, operationTime, nodeA, nodeB]
        javaDoc: "Constructor for an operated switch.\n
                 \n
                 @param uuid of the input entity\n
                 @param id of the asset\n
                 @param operator of the asset\n
                 @param operationTime Time for which the entity is operated\n
                 @param nodeA Grid node at one side of the switch\n
                 @param nodeB Grid node at the other side of the switch\n
                 @param closed Is the switching state 'closed'?\n
                 @param additionalInformation Of the model"
      - name: minimal
        components: [uuid, id, nodeA, nodeB, closed]
        superArgs: [uuid, id, nodeA, nodeB]
        javaDoc: "Constructor for an operated switch.\n
                 \n
                 @param uuid of the input entity\n
                 @param id of the asset\n
                 @param nodeA Grid node at one side of the switch\n
                 @param nodeB Grid node at the other side of the switch\n
                 @param closed Is the switching state 'closed'?"

  TransformerInput:
    classJavaDoc: "Describes an electrical grid transformer, is \"located\" in the inferior subnet."
    constructors:
      - name: full
        components: [uuid, id, operator, operationTime, nodeA, nodeB, parallelDevices, tapPos, autoTap]
        superArgs: [uuid, id, operator, operationTime, nodeA, nodeB, parallelDevices]
        javaDoc: "Constructor for an operated transformer.\n
               \n
               @param uuid of the input entity\n
               @param id of the asset\n
               @param operator of the asset\n
               @param operationTime Time for which the entity is operated\n
               @param nodeA Grid node at the high voltage winding\n
               @param nodeB Grid node at the low voltage winding\n
               @param parallelDevices overall amount of parallel transformers to automatically construct (e.g.\n
                   parallelDevices = 2 will build a total of two transformers using the specified parameters)\n
               @param tapPos Tap Position of this transformer\n
               @param autoTap True, if the tap position of the transformer is adapted automatically"
      - name: minimal
        components: [uuid, id, nodeA, nodeB, parallelDevices, tapPos, autoTap]
        superArgs: [uuid, id, nodeA, nodeB, parallelDevices]
        javaDoc: "Constructor for an operated transformer.\n
               \n
               @param uuid of the input entity\n
               @param id of the asset\n
               @param nodeA Grid node at the high voltage winding\n
               @param nodeB Grid node at the low voltage winding\n
               @param parallelDevices overall amount of parallel transformers to automatically construct (e.g.\n
                   parallelDevices = 2 will build a total of two transformers using the specified parameters)\n
               @param tapPos Tap Position of this transformer\n
               @param autoTap True, if the tap position of the transformer is adapted automatically"

  Transformer2WInput:
    classJavaDoc: "Describes a two winding transformer, that is connected to two {@link NodeInput}s."
    inherits: [HasType]
    constructors:
      - name: full
        components: [uuid, id, operator, operationTime, nodeA, nodeB, parallelDevices, tapPos, autoTap, type]
        superArgs: [uuid, id, operator, operationTime, nodeA, nodeB, parallelDevices, tapPos, autoTap]
        javaDoc: "Constructor for an operated two winding transformer.\n
                 \n
                 @param uuid of the input entity\n
                 @param id of the asset\n
                 @param operator of the asset\n
                 @param operationTime Time for which the entity is operated\n
                 @param nodeA higher voltage node\n
                 @param nodeB lower voltage node\n
                 @param parallelDevices overall amount of parallel transformers to automatically construct (e.g.\n
                     parallelDevices = 2 will build a total of two transformers using the specified parameters)\n
                 @param type of 2W transformer\n
                 @param tapPos Tap position of this transformer\n
                 @param autoTap True, if the tap position of the transformer is adapted automatically"
        constructorChecks:
          - expression: connectsNodesToCorrectVoltageSides(nodeA, nodeB)
            className: ConnectorValidationUtils
      - name: fullWithAdditionalInformation
        components: [uuid, id, operator, operationTime, nodeA, nodeB, parallelDevices, tapPos, autoTap, type, additionalInformation]
        superArgs: [uuid, id, operator, operationTime, nodeA, nodeB, parallelDevices, tapPos, autoTap]
        javaDoc: "Constructor for an operated two winding transformer.\n
                 \n
                 @param uuid of the input entity\n
                 @param id of the asset\n
                 @param operator of the asset\n
                 @param operationTime Time for which the entity is operated\n
                 @param nodeA higher voltage node\n
                 @param nodeB lower voltage node\n
                 @param parallelDevices overall amount of parallel transformers to automatically construct (e.g.\n
                     parallelDevices = 2 will build a total of two transformers using the specified parameters)\n
                 @param type of 2W transformer\n
                 @param tapPos Tap position of this transformer\n
                 @param autoTap True, if the tap position of the transformer is adapted automatically\n
                 @param additionalInformation Of the input"
        constructorChecks:
          - expression: connectsNodesToCorrectVoltageSides(nodeA, nodeB)
            className: ConnectorValidationUtils
      - name: minimal
        components: [uuid, id, nodeA, nodeB, parallelDevices, tapPos, autoTap, type]
        superArgs: [uuid, id, nodeA, nodeB, parallelDevices, tapPos, autoTap]
        javaDoc: "Constructor for an operated two winding transformer.\n
                 \n
                 @param uuid of the input entity\n
                 @param id of the asset\n
                 @param nodeA higher voltage node\n
                 @param nodeB lower voltage node\n
                 @param parallelDevices overall amount of parallel transformers to automatically construct (e.g.\n
                     parallelDevices = 2 will build a total of two transformers using the specified parameters)\n
                 @param type of 2W transformer\n
                 @param tapPos Tap position of this transformer\n
                 @param autoTap True, if the tap position of the transformer is adapted automatically"
        constructorChecks:
          - expression: connectsNodesToCorrectVoltageSides(nodeA, nodeB)
            className: ConnectorValidationUtils

  Transformer2WTypeInput:
    classJavaDoc: "Describes the type of a {@link edu.ie3.datamodel.models.input.connector.Transformer2WInput}."
    constructors:
      - name: full
        components: [uuid, id, rSc, xSc, sRated, vRatedA, vRatedB, gM, bM, dV, dPhi, tapSide, tapNeutr, tapMin, tapMax]
        superArgs: [uuid, id]
        javaDoc: "@param uuid of the input entity\n
               @param id of the type\n
               @param rSc Short circuit resistance\n
               @param xSc Short circuit reactance\n
               @param sRated Rated apparent power (typically in kVA)\n
               @param vRatedA Rated voltage of the high voltage winding\n
               @param vRatedB Rated voltage of the low voltage winding\n
               @param gM Phase-to-ground conductance\n
               @param bM Phase-to-ground susceptance\n
               @param dV Voltage magnitude deviation per tap position\n
               @param dPhi Voltage angle deviation per tap position\n
               @param tapSide Selection of winding, where the tap changer is installed. Low voltage, if true\n
               @param tapNeutr Neutral tap position\n
               @param tapMin Minimum available tap position\n
               @param tapMax Maximum available tap position"
        constructorModifications:
          rSc:
            expression: rSc.to($T.RESISTANCE)
            className: StandardUnits
            insert: true
          xSc:
            expression: xSc.to($T.REACTANCE)
            className: StandardUnits
            insert: true
          sRated:
            expression: sRated.to($T.S_RATED)
            className: StandardUnits
            insert: true
          vRatedA:
            expression: vRatedA.to($T.RATED_VOLTAGE_MAGNITUDE)
            className: StandardUnits
            insert: true
          vRatedB:
            expression: vRatedB.to($T.RATED_VOLTAGE_MAGNITUDE)
            className: StandardUnits
            insert: true
          gM:
            expression: gM.to($T.CONDUCTANCE)
            className: StandardUnits
            insert: true
          bM:
            expression: bM.to($T.SUSCEPTANCE)
            className: StandardUnits
            insert: true
          dV:
            expression: dV.to($T.DV_TAP)
            className: StandardUnits
            insert: true
          dPhi:
            expression: dPhi.to($T.DPHI_TAP)
            className: StandardUnits

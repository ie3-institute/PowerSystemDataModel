  SystemParticipantInput:
    package: edu.ie3.datamodel.models.input.system
    classJavaDoc: "Describes a system asset that is connected to a node."
    inherits: [HasNodes, HasEm]
    constructors:
      - name: full
        components: [uuid, id, operator, operationTime, node, qCharacteristics, controllingEm]
        superArgs: [uuid, id, operator, operationTime]
        javaDoc: "Constructor for an operated system participant.\n
               \n
               @param uuid of the input entity\n
               @param id of the asset\n
               @param operator of the asset\n
               @param operationTime Time for which the entity is operated\n
               @param node that the asset is connected to\n
               @param qCharacteristics Description of a reactive power characteristic\n
               @param controllingEm The {@link EmInput} controlling this system participant. Null, if not applicable."
      - name: minimal
        components: [uuid, id, node, qCharacteristics, controllingEm]
        superArgs: [uuid, id]
        javaDoc: "Constructor for an operated system participant.\n
               \n
               @param uuid of the input entity\n
               @param id of the asset\n
               @param node that the asset is connected to\n
               @param qCharacteristics Description of a reactive power characteristic\n
               @param controllingEm The {@link EmInput} controlling this system participant. Null, if not applicable."
    methodOverrides:
      - name: allNodes
        type: NodeList
        expression: singletonList(node)
        className: Collections
    methodInserts:
      - name: sRated
        type: Power
        isAbstract: true
    copyBuilderAdditionalMethods:
      - name: scale
        isAbstract: true
        javaDoc: "Scales the input entity in a way that tries to preserve proportions that are related to\n
               power. This means that capacity, consumption etc. are scaled with the same factor. Related\n
               properties associated with the input type (if applicable) are scaled as well.\n
               \n
               @param factor The factor to scale with\n
               @return A copy builder with scaled relevant properties"
        parameters:
          - name: factor
            type: double
    nonCapitalizedGetters: [qCharacteristics]
    optionalGetters: [controllingEm]


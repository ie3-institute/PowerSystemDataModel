version: 1.0
datamodel:
  models:
    UniqueEntity:
      classJavaDoc: "Supplies every subclass with a generated UUID, making it unique."
      inherits: [ Entity, Uniqueness, Serializable ]
      constructors:
        - name: minimal
          components: [ ]
        - name: full
          components: [ uuid ]

  models.input:
    UniqueInputEntity:
      classJavaDoc: "Functionless class to describe that all subclasses are unique input classes."
      inherits: [InputEntity]
      constructors:
        - name: minimal
          components: [uuid]
          superArgs: [uuid]

    AssetInput:
      classJavaDoc: "Describes a grid asset under the assumption that every asset could be operable."
      inherits: [Operable]
      constructors:
        - name: full
          components: [uuid, id, operator, operationTime]
          superArgs: [uuid]
          javaDoc: "Constructor for an asset with timely limited operation and specific operator.\n
                   \n
                   @param uuid Unique identifier\n
                   @param id Human-readable identifier\n
                   @param operator Operator of the asset\n
                   @param operationTime Operation time limitation"
        - name: minimal
          components: [uuid, id]
          superArgs: [uuid]
          javaDoc: "Constructor for an asset with timely unlimited operation and unassigned operator.\n
                   \n
                   @param uuid Unique identifier\n
                   @param id Human-readable identifier"

    AssetTypeInput:
      classJavaDoc: "Describes the type of {@link edu.ie3.datamodel.models.input.AssetInput}."
      constructors:
        - name: full
          components: [uuid, id]
          superArgs: [uuid]
          javaDoc: "@param uuid of the input entity\n
                  @param id of the asset"

    NodeInput:
      classJavaDoc: "Describes an electrical grid node, that other assets can connect to."
      constructors:
        - name: full
          components: [uuid, id, operator, operationTime, vTarget, slack, geoPosition, voltLvl, subnet]
          superArgs: [uuid, id, operator, operationTime]
          javaDoc: "Constructor for an operated node.\n
                   \n
                   @param uuid of the input entity\n
                   @param id of the asset\n
                   @param operator of the asset\n
                   @param operationTime Time for which the entity is operated\n
                   @param vTarget Target voltage magnitude of the node with regard to its rated voltage\n
                   @param slack Is this node a slack node?\n
                   @param geoPosition Coordinates of this node, especially relevant for geo-dependant systems,
                       that are connected to this node\n
                   @param voltLvl Voltage level of this node\n
                   @param subnet of this node"
        - name: fullWithAdditionalInformation
          components: [ uuid, id, operator, operationTime, vTarget, slack, geoPosition, voltLvl, subnet, additionalInformation ]
          superArgs: [ uuid, id, operator, operationTime ]
          javaDoc: "Constructor for an operated node.\n
                  \n
                  @param uuid of the input entity\n
                  @param id of the asset\n
                  @param operator of the asset\n
                  @param operationTime Time for which the entity is operated\n
                  @param vTarget Target voltage magnitude of the node with regard to its rated voltage\n
                  @param slack Is this node a slack node?\n
                  @param geoPosition Coordinates of this node, especially relevant for geo-dependant systems,
                      that are connected to this node\n
                  @param voltLvl Voltage level of this node\n
                  @param subnet of this node\n
                  @param additionalInformation That were provided by the source"
        - name: minimal
          components: [ uuid, id, vTarget, slack, geoPosition, voltLvl, subnet ]
          superArgs: [ uuid, id ]
          javaDoc: "Constructor for an operated node.\n
                   \n
                   @param uuid of the input entity\n
                   @param id of the asset\n
                   @param vTarget Target voltage magnitude of the node with regard to its rated voltage\n
                   @param slack Is this node a slack node?\n
                   @param geoPosition Coordinates of this node, especially relevant for geo-dependant systems,
                       that are connected to this node\n
                   @param voltLvl Voltage level of this node\n
                   @param subnet of this node"
      staticFields:
        - name: DEFAULT_GEO_POSITION
          type: Point
          expression: buildPoint(51.4843281, 7.4116482)
          className: GeoUtils
          javaDoc: "Use this default value if geoPosition is unknown."
      nonCapitalizedGetters: [vTarget]

    OperatorInput:
      classJavaDoc: "Describes an operator, that operates assets."
      constructors:
        - name: minimal
          components: [uuid, id]
          superArgs: [uuid]
          javaDoc: "Constructor for an Operator.\n
                   \n
                   @param uuid Unique identifier\n
                   @param id Human readable identifier"
        - name: withAdditionalInformation
          components: [uuid, id, additionalInformation]
          superArgs: [uuid]
          javaDoc: "Constructor for an Operator.\n
                   \n
                   @param uuid Unique identifier\n
                   @param id Human readable identifier\n
                   @param additionalInformation That were provided by the source"
      staticFields:
        - name: NO_OPERATOR_ASSIGNED
          type: OperatorInput
          expression: new OperatorInput(UUID.randomUUID(), "NO_OPERATOR_ASSIGNED")

  models.input.connector.type:
    CableTypeInput:
      classJavaDoc: "Represents detailed cable construction data at the type/catalog level. This class contains the\n
                   complete specification of a cable type including conductors, insulation layers, screens, armor,\n
                   and jacket elements, as well as electrical and thermal parameters."
      constructors:
        - name: full
          components: [uuid, id, coreNumber, conductor, isolation, screen, filler, armor, jack, limitTemperature, frequency, skinEffectCoefficient, proximityEffectCoefficient, electricalCapacitance, tanDelta, circulatingLossFactor, eddyCurrentLossFactor]
          superArgs: [uuid, id]
          javaDoc: "Represents detailed cable construction data at the type/catalog level. This class contains the\n
                 complete specification of a cable type including conductors, insulation layers, screens, armor,\n
                 and jacket elements, as well as electrical and thermal parameters.\n
                 \n
                 @param uuid Unique identifier for this cable type\n
                 @param id Human-readable identifier/name for this cable type (e.g., \"NA2XS2Y 1x120 RM/25 12/20\n
                     kV\")\n
                 @param coreNumber Number of cores/conductors in the cable (e.g., 1 for single-core, 3 for\n
                     three-phase)\n
                 @param conductor The innermost conductor/core\n
                 @param isolation List of insulation layers (from inner to outer)\n
                 @param screen Optional cable screen layer\n
                 @param filler List of filler layers (from inner to outer)\n
                 @param armor List of armor layers (from inner to outer)\n
                 @param jack List of jacket/outer sheath layers (from inner to outer)\n
                 @param limitTemperature Maximum permissible operating temperature (°C)\n
                 @param frequency Rated frequency\n
                 @param skinEffectCoefficient Skin effect coefficient\n
                 @param proximityEffectCoefficient Proximity effect coefficient\n
                 @param electricalCapacitance Capacitance per unit length\n
                 @param tanDelta Dielectric loss factor tan(δ)\n
                 @param circulatingLossFactor Circulating loss factor\n
                 @param eddyCurrentLossFactor Eddy current loss factor"
          constructorModifications:
            isolation:
              expression: copyOf(isolation)
              className: List
            filler:
              expression: copyOf(filler)
              className: List
            armor:
              expression: copyOf(armor)
              className: List
            jack:
              expression: copyOf(jack)
              className: List

    LayerInput:
      classJavaDoc: "Represents a concentric layer of a cable, including insulation, filler, armor, and jacket layers."
      constructors:
        - name: full
          components: [uuid, id, material, innerDiameter, outerDiameter, thermalResistivity, thermalCapacitance, area]
          superArgs: [uuid, id]
          javaDoc: "Constructor of a cable layer.\n
                 \n
                 @param uuid UUID of this layer\n
                 @param id Name/designation of this layer\n
                 @param material Material of this layer\n
                 @param innerDiameter Inner diameter of this layer\n
                 @param outerDiameter Outer diameter of this layer\n
                 @param thermalResistivity Thermal resistivity of the material\n
                 @param thermalCapacitance Thermal capacitance of the material\n
                 @param area Real cross-sectional area (if different from geometry)"
        - name: withoutArea
          components: [uuid, id, material, innerDiameter, outerDiameter, thermalResistivity, thermalCapacitance]
          superArgs: [uuid, id]
          javaDoc: "Constructor of a cable layer.\n
                 \n
                 @param uuid UUID of this layer\n
                 @param id Name/designation of this layer\n
                 @param material Material of this layer\n
                 @param innerDiameter Inner diameter of this layer\n
                 @param outerDiameter Outer diameter of this layer\n
                 @param thermalResistivity Thermal resistivity of the material\n
                 @param thermalCapacitance Thermal capacitance of the material"
          constructorModifications:
            area:
              expression: null
        - name: fullWithAdditionalInformation
          components: [ uuid, id, material, innerDiameter, outerDiameter, thermalResistivity, thermalCapacitance, area, additionalInformation]
          superArgs: [ uuid, id ]
          javaDoc: "Constructor of a cable layer.\n
                 \n
                 @param uuid UUID of this layer\n
                 @param id Name/designation of this layer\n
                 @param material Material of this layer\n
                 @param innerDiameter Inner diameter of this layer\n
                 @param outerDiameter Outer diameter of this layer\n
                 @param thermalResistivity Thermal resistivity of the material\n
                 @param thermalCapacitance Thermal capacitance of the material\n
                 @param area Real cross-sectional area (if different from geometry)\n
                 @param additionalInformation That were provided by the source"
        - name: withoutAreaWithAdditionalInformation
          components: [ uuid, id, material, innerDiameter, outerDiameter, thermalResistivity, thermalCapacitance, additionalInformation]
          superArgs: [ uuid, id ]
          javaDoc: "Constructor of a cable layer.\n
                 \n
                 @param uuid UUID of this layer\n
                 @param id Name/designation of this layer\n
                 @param material Material of this layer\n
                 @param innerDiameter Inner diameter of this layer\n
                 @param outerDiameter Outer diameter of this layer\n
                 @param thermalResistivity Thermal resistivity of the material\n
                 @param thermalCapacitance Thermal capacitance of the material\n
                 @param additionalInformation That were provided by the source"
          constructorModifications:
            area:
              expression: null
      fieldNameGetters: [material, innerDiameter, outerDiameter, thermalResistivity, thermalCapacitance, area]
      methodInserts:
        - name: name
          type: String
          expression: getId()

    LineTypeInput:
      classJavaDoc: "Describes the type of {@link edu.ie3.datamodel.models.input.connector.LineInput}."
      constructors:
        - name: full
          components: [uuid, id, b, g, r, x, iMax, vRated]
          superArgs: [uuid, id]
          javaDoc: "@param uuid of the input entity\n
                 @param id of this type\n
                 @param b Specific phase-to-ground susceptance for this type of line (typically in µS/km)\n
                 @param g Specific phase-to-ground conductance for this type of line (typically in µS/km)\n
                 @param r Specific resistance for this type of line (typically in Ohm/km)\n
                 @param x Specific reactance for this type of line (typically in Ohm/km)\n
                 @param iMax Maximum thermal current for this type of line (typically in A)\n
                 @param vRated Rated voltage for this type of line"
        - name: fullWithAdditionalInformation
          components: [uuid, id, b, g, r, x, iMax, vRated, additionalInformation]
          superArgs: [uuid, id]
          javaDoc: "@param uuid of the input entity\n
                 @param id of this type\n
                 @param b Specific phase-to-ground susceptance for this type of line (typically in µS/km)\n
                 @param g Specific phase-to-ground conductance for this type of line (typically in µS/km)\n
                 @param r Specific resistance for this type of line (typically in Ohm/km)\n
                 @param x Specific reactance for this type of line (typically in Ohm/km)\n
                 @param iMax Maximum thermal current for this type of line (typically in A)\n
                 @param vRated Rated voltage for this type of line\n
                 @param additionalInformation That were provided by the source"
      nonCapitalizedGetters: [iMax, vRated]


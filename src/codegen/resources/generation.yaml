               @param ethCapa Thermal capacity of the included thermal house model\n
               @param targetTemperature Desired target temperature of the thermal house model\n
               @param upperTemperatureLimit Upper boundary temperature of the thermal house model\n
               @param lowerTemperatureLimit Lower boundary temperature of the thermal house model\n
               @param housingType Type of the building: either house or flat\n
               @param numberOfInhabitants Number of inhabitants living in this house\n
               @param additionalInformation Of the input"
    copyBuilderAdditionalMethods:
      - name: scale
        isAbstract: false
        parameters:
          - name: factor
            type: double
        expression: ethLosses(ethLosses.multiply(factor)); ethCapa(ethCapa.multiply(factor)); numberOfInhabitants(numberOfInhabitants * factor)
        comment: "scale losses as well as capacity and number of inhabitants to keep equal\n
                // the time needed to heat a scaled house"



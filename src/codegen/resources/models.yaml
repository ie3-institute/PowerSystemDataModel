models:
  UniqueEntity:
    name: UniqueEntity
    package: edu.ie3.datamodel.models2.input
    components:
      - name: uuid
        type: UUID
        keys: [uuid]
        required: true

  UniqueInputEntity:
    name: UniqueInputEntity
    package: edu.ie3.datamodel.models2.input
    kind: abstractClass
    extends: UniqueEntity

    components:
      - name: additionalInformation
        type: StringMap
        keys: [additionalInformation]
        required: false

  AssetInput:
    name: AssetInput
    package: edu.ie3.datamodel.models2.input
    kind: abstractClass
    extends: UniqueInputEntity
    inherits: []

    components:
      - name: id
        type: String
        required: true
      - name: operator
        type: OperatorInput
        required: false
      - name: operationTime
        type: OperationTime
        keys: [operationStart, operationEnd]
        required: false

  NodeInput:
    name: NodeInput
    package: edu.ie3.datamodel.models2.input
    kind: class
    extends: AssetInput

    components:
      - name: slack
        type: bool
      - name: subgrid
        type: int


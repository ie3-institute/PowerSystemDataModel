models:
  UniqueEntity:
    name: UniqueEntity
    package: edu.ie3.datamodel.models
    components:
      - name: uuid
        type: UUID

  UniqueInputEntity:
    name: UniqueInputEntity
    package: edu.ie3.datamodel.models.input
    extends: UniqueEntity
    components:
      - name: additionalInformation
        type: StringMap
        keys: [additionalInformation]
        required: false

  AssetInput:
    name: AssetInput
    package: edu.ie3.datamodel.models.input
    extends: UniqueInputEntity
    components:
      - name: id
        type: String
        javaDoc: "Name or ID of the asset."
      - name: operator
        type: OperatorInput
        required: false
        nested: true
        javaDoc: "The operator of this asset."
      - name: operationTime
        type: OperationTime
        keys: [operationStart, operationEnd]
        required: false
        javaDoc: "Time for which the entity is operated."

  AssetTypeInput:
    name: AssetTypeInput
    package: edu.ie3.datamodel.models.input
    extends: UniqueInputEntity
    components:
      - name: id
        type: String
        required: true
        javaDoc: "Name or ID of the asset."

  NodeInput:
    name: NodeInput
    package: edu.ie3.datamodel.models.input
    class: true
    extends: AssetInput
    components:
      - name: vTarget
        type: Dimensionless
        javaDoc: "Target voltage magnitude of the node with regard to its rated voltage (typically in p.u.)."
      - name: slack
        type: bool
        javaDoc: "Is this node a slack node?"
      - name: geoPosition
        type: Point
        javaDoc: "The coordinates of this node, especially relevant for geo-dependant systems, that are connected to this node."
      - name: voltLvl
        type: VoltageLevel
        keys: [voltLvl, vRated]
        javaDoc: "Voltage level of this node."
      - name: subnet
        type: int
        javaDoc: "Subgrid of this node."

  OperatorInput:
    name: OperatorInput
    package: edu.ie3.datamodel.models.input
    class: true
    extends: UniqueInputEntity
    components:
      - name: id
        type: String
        javaDoc: "The id (=name) of this operator."

  MeasurementUnitInput:
    name: MeasurementUnitInput
    package: edu.ie3.datamodel.models.input
    class: true
    extends: AssetInput
    components:
      - name: node
        type: NodeInput
        javaDoc: "Grid node, the asset is attached to."
      - name: vMag
        type: bool
        javaDoc: "True, if the voltage magnitude is measured."
      - name: vAng
        type: bool
        javaDoc: "True, if the voltage angle is measured."
      - name: p
        type: bool
        javaDoc: "True, if the nodal residual active power is measured."
      - name: q
        type: bool
        javaDoc: "True, if the reactive power is measured."

  EmInput:
    name: EmInput
    package: edu.ie3.datamodel.models.input
    extends: AssetInput
    class: true
    components:
      - name: controlStrategy
        type: String
        javaDoc: "Reference to the control strategy to be used for this model."
      - name: controllingEm
        type: EmInput
        nullable: true
        javaDoc: "Optional UUID of the parent {@link EmInput} that is controlling this em unit. If null, this em
                unit is not em-controlled."

  ConnectorInput:
    name: ConnectorInput
    package: edu.ie3.datamodel.models.input.connector
    extends: AssetInput
    components:
      - name: nodeA
        type: NodeInput
        nested: true
        javaDoc: "Grid node at one side of the connector."
      - name: nodeB
        type: NodeInput
        nested: true
        javaDoc: "Grid node at the other side of the connector."
      - name: parallelDevices
        type: int
        javaDoc: "Amount of parallel devices."

  LineInput:
    name: LineInput
    package: edu.ie3.datamodel.models.input.connector
    extends: ConnectorInput
    class: true
    components:
      - name: type
        type: LineTypeInput
        javaDoc: "Type of this line, containing default values for lines of this kind."
      - name: length
        type: Length
        javaDoc: "Length of this line."
      - name: geoPosition
        type: LineString
        javaDoc: "Coordinates of this line."
      - name: olmCharacteristic
        type: OlmCharacteristicInput
        javaDoc: "Description of an optional weather dependent operation curve."

  LineTypeInput:
    name: LineTypeInput
    package: edu.ie3.datamodel.models.input.connector.type
    extends: AssetTypeInput
    class: true
    components:
      - name: b
        type: SpecificConductance
        javaDoc: "Specific phase-to-ground susceptance for this type of line (typically in µS/km)."
      - name: g
        type: SpecificConductance
        javaDoc: "Specific phase-to-ground conductance for this type of line (typically in µS/km)."
      - name: r
        type: SpecificResistance
        javaDoc: "Specific resistance for this type of line (typically in Ohm/km)."
      - name: x
        type: SpecificResistance
        javaDoc: "Specific reactance for this type of line (typically in Ohm/km)."
      - name: iMax
        type: ElectricCurrent
        javaDoc: "Maximum thermal current for this type of line (typically in A)."
      - name: vRated
        type: ElectricPotential
        javaDoc: "Rated voltage for this type of line (typically in V)."

  TransformerInput:
    name: TransformerInput
    package: edu.ie3.datamodel.models.input.connector
    extends: ConnectorInput
    components:
      - name: tapPos
        type: int
        javaDoc: "Tap position of this transformer."
      - name: autoTap
        type: bool
        javaDoc: "True, if the tap position of the transformer is adapted automatically."

  Transformer2WInput:
    name: Transformer2WInput
    package: edu.ie3.datamodel.models.input.connector
    extends: TransformerInput
    class: true
    components:
      - name: type
        type: Transformer2WTypeInput
        nested: true
        javaDoc: "Type of this 2W transformer, containing default values for transformers of this kind."

  Transformer2WTypeInput:
    name: Transformer2WTypeInput
    package: edu.ie3.datamodel.models.input.connector.type
    extends: AssetTypeInput
    class: true
    components:
      - name: rSc
        type: ElectricResistance
        javaDoc: "Short circuit resistance (typically in Ohm)."
      - name: xSc
        type: ElectricResistance
        javaDoc: "Short circuit reactance (typically in Ohm)."
      - name: sRated
        type: Power
        javaDoc: "Rated apparent power (typically in kVA)."
      - name: vRatedA
        type: ElectricPotential
        javaDoc: "Rated voltage of the high voltage winding (typically in kV)."
      - name: vRatedB
        type: ElectricPotential
        javaDoc: "Rated voltage of the low voltage winding (typically in kV)."
      - name: gM
        type: ElectricConductance
        javaDoc: "Phase-to-ground conductance (typically in nS)."
      - name: bM
        type: ElectricConductance
        javaDoc: "Phase-to-ground susceptance (typically in nS)."
      - name: dV
        type: Percent
        javaDoc: "Voltage magnitude deviation per tap position (typically in %)."
      - name: dPhi
        type: DegreeGeom
        javaDoc: "Voltage angle deviation per tap position (typically in °)."
      - name: tapSide
        type: bool
        javaDoc: "Selection of winding, where the tap changer is installed. Low voltage, if true."
      - name: tapNeutr
        type: int
        javaDoc: "Neutral tap position."
      - name: tapMin
        type: int
        javaDoc: "Minimum available tap position."
      - name: tapMax
        type: int
        javaDoc: "Maximum available tap position."

  Transformer3WInput:
    name: Transformer3WInput
    package: edu.ie3.datamodel.models.input.connector
    extends: TransformerInput
    class: true
    components:
      - name: type
        type: Transformer3WTypeInput
        nested: true
        javaDoc: "Type of this 3W transformer, containing default values for transformers of this kind."
      - name: nodeC
        type: NodeInput
        nested: true
        javaDoc: "The lower voltage node."
      - name: nodeInternal
        type: NodeInput
        nested: true
        javaDoc: "Internal node of the transformers T equivalent circuit."

  SwitchInput:
    name: SwitchInput
    package: edu.ie3.datamodel.models.input.connector
    extends: ConnectorInput
    class: true
    unsupported: [parallelDevices]
    components:
      - name: closed
        type: bool
        javaDoc: "Is the switching state 'closed'?"

  Transformer3WTypeInput:
    name: Transformer3WTypeInput
    package: edu.ie3.datamodel.models.input.connector.type
    extends: AssetTypeInput
    class: true
    components:
      - name: sRatedA
        type: Power
        javaDoc: "Rated apparent power of the high voltage winding (typically in kVA)."
      - name: sRatedB
        type: Power
        javaDoc: "Rated apparent power of the medium voltage winding (typically in kVA)."
      - name: sRatedC
        type: Power
        javaDoc: "Rated apparent power of the low voltage windings (typically in kVA)."
      - name: vRatedA
        type: ElectricPotential
        javaDoc: "Rated voltage of the high voltage winding (typically in kV)."
      - name: vRatedB
        type: ElectricPotential
        javaDoc: "Rated voltage of the medium voltage winding (typically in kV)."
      - name: vRatedC
        type: ElectricPotential
        javaDoc: "Rated voltage of the low voltage winding (typically in kV)."
      - name: rScA
        type: ElectricResistance
        javaDoc: "Short-circuit resistance of the high voltage winding (typically in Ohm)."
      - name: rScB
        type: ElectricResistance
        javaDoc: "Short-circuit resistance of the medium voltage winding (typically in Ohm)."
      - name: rScC
        type: ElectricResistance
        javaDoc: "Short-circuit resistance of the low voltage winding (typically in Ohm)."
      - name: xScA
        type: ElectricResistance
        javaDoc: "Short-circuit reactance of the high voltage winding (typically in Ohm)."
      - name: xScB
        type: ElectricResistance
        javaDoc: "Short-circuit reactance of the medium voltage winding (typically in Ohm)."
      - name: xScC
        type: ElectricResistance
        javaDoc: "Short-circuit reactance of the low voltage winding (typically in Ohm)."
      - name: gM
        type: ElectricConductance
        javaDoc: "Phase-to-ground conductance (typically in nS)."
      - name: bM
        type: ElectricConductance
        javaDoc: "Phase-to-ground susceptance (typically in nS)."
      - name: dV
        type: Percent
        javaDoc: "Voltage magnitude deviation per tap position (typically in %)."
      - name: dPhi
        type: DegreeGeom
        javaDoc: "Voltage angle deviation per tap position (typically in °)."
      - name: tapNeutr
        type: int
        javaDoc: "Neutral tap position."
      - name: tapMin
        type: int
        javaDoc: "Minimum available tap position."
      - name: tapMax
        type: int
        javaDoc: "Maximum available tap position."



















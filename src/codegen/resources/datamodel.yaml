version: 1.0
datamodel:
  models:
    UniqueEntity:
      name: UniqueEntity
      components:
        - name: uuid
          type: UUID

  models.input:
    UniqueInputEntity:
      name: UniqueInputEntity
      extends: UniqueEntity
      components:
        - name: additionalInformation
          type: StringMap
          keys: [additionalInformation]
          required: false

    AssetInput:
      name: AssetInput
      extends: UniqueInputEntity
      components:
        - name: id
          type: String
          javaDoc: "Name or ID of the asset."
        - name: operator
          type: OperatorInput
          required: true # TODO: Change this to false
          nested: true
          javaDoc: "The operator of this asset."
        - name: operationTime
          type: OperationTime
          keys: [operatesFrom, operatesUntil]
          required: true # TODO: Change this to false
          javaDoc: "Time for which the entity is operated."

    NodeInput:
      name: NodeInput
      abstract: false
      extends: AssetInput
      components:
        - name: vTarget
          type: Dimensionless
          javaDoc: "Target voltage magnitude of the node with regard to its rated voltage (typically in p.u.)."
        - name: slack
          type: bool
          javaDoc: "Is this node a slack node?"
        - name: geoPosition
          type: Point
          javaDoc: "The coordinates of this node, especially relevant for geo-dependant systems, that are connected to this node."
        - name: voltLvl
          type: VoltageLevel
          keys: [voltLvl, vRated]
          javaDoc: "Voltage level of this node."
        - name: subnet
          type: int
          javaDoc: "Subgrid of this node."

    OperatorInput:
      name: OperatorInput
      abstract: false
      extends: UniqueInputEntity
      components:
        - name: id
          type: String
          javaDoc: "The id (=name) of this operator."

    AssetTypeInput:
      name: AssetTypeInput
      extends: UniqueInputEntity
      components:
        - name: id
          type: String
          required: true
          javaDoc: "Name or ID of the asset."

  models.input.connector.type:
    LineTypeInput:
      name: LineTypeInput
      extends: AssetTypeInput
      abstract: false
      components:
        - name: b
          type: SpecificConductance
          javaDoc: "Specific phase-to-ground susceptance for this type of line (typically in µS/km)."
        - name: g
          type: SpecificConductance
          javaDoc: "Specific phase-to-ground conductance for this type of line (typically in µS/km)."
        - name: r
          type: SpecificResistance
          javaDoc: "Specific resistance for this type of line (typically in Ohm/km)."
        - name: x
          type: SpecificResistance
          javaDoc: "Specific reactance for this type of line (typically in Ohm/km)."
        - name: iMax
          type: ElectricCurrent
          javaDoc: "Maximum thermal current for this type of line (typically in A)."
        - name: vRated
          type: ElectricPotential
          javaDoc: "Rated voltage for this type of line (typically in V)."

    Transformer2WTypeInput:
      name: Transformer2WTypeInput
      extends: AssetTypeInput
      abstract: false
      components:
        - name: rSc
          type: ElectricResistance
          javaDoc: "Short circuit resistance (typically in Ohm)."
        - name: xSc
          type: ElectricResistance
          javaDoc: "Short circuit reactance (typically in Ohm)."
        - name: sRated
          type: Power
          javaDoc: "Rated apparent power (typically in kVA)."
        - name: vRatedA
          type: ElectricPotential
          javaDoc: "Rated voltage of the high voltage winding (typically in kV)."
        - name: vRatedB
          type: ElectricPotential
          javaDoc: "Rated voltage of the low voltage winding (typically in kV)."
        - name: gM
          type: ElectricConductance
          javaDoc: "Phase-to-ground conductance (typically in nS)."
        - name: bM
          type: ElectricConductance
          javaDoc: "Phase-to-ground susceptance (typically in nS)."
        - name: dV
          type: Percent
          javaDoc: "Voltage magnitude deviation per tap position (typically in %)."
        - name: dPhi
          type: DegreeGeom
          javaDoc: "Voltage angle deviation per tap position (typically in °)."
        - name: tapSide
          type: bool
          javaDoc: "Selection of winding, where the tap changer is installed. Low voltage, if true."
        - name: tapNeutr
          type: int
          javaDoc: "Neutral tap position."
        - name: tapMin
          type: int
          javaDoc: "Minimum available tap position."
        - name: tapMax
          type: int
          javaDoc: "Maximum available tap position."

    Transformer3WTypeInput:
      name: Transformer3WTypeInput
      extends: AssetTypeInput
      abstract: false
      components:
        - name: sRatedA
          type: Power
          javaDoc: "Rated apparent power of the high voltage winding (typically in kVA)."
        - name: sRatedB
          type: Power
          javaDoc: "Rated apparent power of the medium voltage winding (typically in kVA)."
        - name: sRatedC
          type: Power
          javaDoc: "Rated apparent power of the low voltage windings (typically in kVA)."
        - name: vRatedA
          type: ElectricPotential
          javaDoc: "Rated voltage of the high voltage winding (typically in kV)."
        - name: vRatedB
          type: ElectricPotential
          javaDoc: "Rated voltage of the medium voltage winding (typically in kV)."
        - name: vRatedC
          type: ElectricPotential
          javaDoc: "Rated voltage of the low voltage winding (typically in kV)."
        - name: rScA
          type: ElectricResistance
          javaDoc: "Short-circuit resistance of the high voltage winding (typically in Ohm)."
        - name: rScB
          type: ElectricResistance
          javaDoc: "Short-circuit resistance of the medium voltage winding (typically in Ohm)."
        - name: rScC
          type: ElectricResistance
          javaDoc: "Short-circuit resistance of the low voltage winding (typically in Ohm)."
        - name: xScA
          type: ElectricResistance
          javaDoc: "Short-circuit reactance of the high voltage winding (typically in Ohm)."
        - name: xScB
          type: ElectricResistance
          javaDoc: "Short-circuit reactance of the medium voltage winding (typically in Ohm)."
        - name: xScC
          type: ElectricResistance
          javaDoc: "Short-circuit reactance of the low voltage winding (typically in Ohm)."
        - name: gM
          type: ElectricConductance
          javaDoc: "Phase-to-ground conductance (typically in nS)."
        - name: bM
          type: ElectricConductance
          javaDoc: "Phase-to-ground susceptance (typically in nS)."
        - name: dV
          type: Percent
          javaDoc: "Voltage magnitude deviation per tap position (typically in %)."
        - name: dPhi
          type: DegreeGeom
          javaDoc: "Voltage angle deviation per tap position (typically in °)."
        - name: tapNeutr
          type: int
          javaDoc: "Neutral tap position."
        - name: tapMin
          type: int
          javaDoc: "Minimum available tap position."
        - name: tapMax
          type: int
          javaDoc: "Maximum available tap position."

  models.input.system.type:
    SystemParticipantTypeInput:
      name: SystemParticipantTypeInput
      extends: AssetTypeInput
      components:
        - name: capex
          type: Currency
          javaDoc: "Capital expense for this type of system participant (typically in €)."
        - name: opex
          type: EnergyPrice
          javaDoc: "Operating expense for this type of system participant (typically in €/MWh)."
        - name: sRated
          type: Power
          javaDoc: "Rated apparent power of the type (in kVA)."
        - name: cosPhiRated
          type: double
          javaDoc: "Power factor for this type of system participant."

  result:
    ResultEntity:
      name: ResultEntity
      components:
        - name: time
          type: ZonedDateTime
          javaDoc: "Date and time of the produced result."
        - name: inputModel
          type: UUID
          javaDoc: "Uuid of the input model that produces the result."

    NodeResult:
      name: NodeResult
      extends: ResultEntity
      abstract: false
      components:
        - name: vMag
          type: Dimensionless
          javaDoc: "Voltage magnitude @ this node in p.u."
        - name: vAng
          type: Angle
          javaDoc: "Voltage angle @ this node in degree."

    CongestionResult:
      name: CongestionResult
      extends: ResultEntity
      abstract: false
      components:
        - name: subgrid
          type: int
        - name: type
          type: InputModelType
        - name: value
          type: Dimensionless
        - name: min
          type: Dimensionless
        - name: max
          type: Dimensionless

  result.connector:
    ConnectorResult:
      name: ConnectorResult
      extends: ResultEntity
      components:
        - name: iAMag
          type: ElectricCurrent
          javaDoc: "Electric current magnitude @ port A, normally provided in Ampere."
        - name: iAAng
          type: Angle
          javaDoc: "Electric current angle @ Port A in degree °."
        - name: iBMag
          type: ElectricCurrent
          javaDoc: "Electric current magnitude @ port B, normally provided in Ampere."
        - name: iBAng
          type: Angle
          javaDoc: "Electric current angle @ Port B in degree °."

    LineResult:
      name: LineResult
      extends: ConnectorResult
      abstract: false

    SwitchResult:
      name: SwitchResult
      extends: ResultEntity
      abstract: false
      components:
        - name: closed
          type: bool
          javaDoc: "Is the switching state 'closed'?"

    TransformerResult:
      name: TransformerResult
      extends: ConnectorResult
      abstract: false
      components:
        - name: tapPos
          type: int
          javaDoc: "Current tapping position if a transformer has a tap changer."

    Transformer2WResult:
      name: Transformer2WResult
      extends: TransformerResult
      abstract: false

    Transformer3WResult:
      name: Transformer3WResult
      extends: TransformerResult
      abstract: false
      components:
        - name: iCMag
          type: ElectricCurrent
        - name: iCAng
          type: Angle

  results.system:
    SystemParticipantResult:
      name: SystemParticipantResult
      extends: ResultEntity
      components:
        - name: p
          type: Power
          javaDoc: "Active power output normally provided in MW."
        - name: q
          type: Power
          javaDoc: "Reactive power output normally provided in MVAr."

    SystemParticipantWithHeatResult:
      name: SystemParticipantWithHeatResult
      extends: SystemParticipantResult
      components:
        - name: qDot
          type: Power
          javaDoc: "The thermal power output normally provided in MW."

    ElectricalEnergyStorageResult:
      name: ElectricalEnergyStorageResult
      extends: SystemParticipantResult
      components:
        - name: soc
          type: Dimensionless
          javaDoc: "State of Charge (SoC) in %."

    FlexOptionsResult:
      name: FlexOptionsResult
      extends: ResultEntity
      components:
        - name: pMin
          type: Power
          javaDoc: "Minimum active power to which the operating point of the model can be reduced (might be\n
                 negative, thus feed-in) at the given point in simulation time. This equates to the lower bound\n
                 of possible power flexibility provision."
        - name: pMax
          type: Power
          javaDoc: "Maximum active power to which the operating point of the model can be increased (might be\n
                  negative, thus feed-in) at the given point in simulation time. This equates to upper bound of\n
                  possible power flexibility provision."

    AcResult:
      name: AcResult
      extends: SystemParticipantWithHeatResult
      abstract: false

    BmResult:
      name: BmResult
      extends: SystemParticipantResult
      abstract: false

    ChpResult:
      name: ChpResult
      extends: SystemParticipantWithHeatResult
      abstract: false

    EmResult:
      name: EmResult
      extends: SystemParticipantResult
      abstract: false

    EnergyBoundariesFlexOptionsResult:
      name: EnergyBoundariesFlexOptionsResult
      extends: FlexOptionsResult
      abstract: false
      components:
        - name: eState
          type: Energy
          javaDoc: "State of energy of the model at the given point in simulation time."
        - name: eMin
          type: Energy
          javaDoc: "Minimum state of energy of the model at the given point in simulation time."
        - name: eMax
          type: Energy
          javaDoc: "Maximum state of energy of the model at the given point in simulation time."

    EvcsResult:
      name: EvcsResult
      extends: SystemParticipantResult
      abstract: false

    EvResult:
      name: EvResult
      extends: ElectricalEnergyStorageResult
      abstract: false

    FixedFeedInResult:
      name: FixedFeedInResult
      extends: SystemParticipantResult
      abstract: false

    HpResult:
      name: HpResult
      extends: SystemParticipantWithHeatResult
      abstract: false

    LoadResult:
      name: LoadResult
      extends: SystemParticipantResult
      abstract: false

    PowerLimitFlexOptionsResult:
      name: PowerLimitFlexOptionsResult
      extends: FlexOptionsResult
      abstract: false
      components:
        - name: pRef
          type: Power
          javaDoc: "Active power (might be negative, thus feed-in) that was suggested for regular usage by the\n
                  model."

    PvResult:
      name: PvResult
      extends: SystemParticipantResult
      abstract: false

    StorageResult:
      name: StorageResult
      extends: ElectricalEnergyStorageResult
      abstract: false

    WecResult:
      name: WecResult
      extends: SystemParticipantResult
      abstract: false

  result.thermal:
    ThermalUnitResult:
      name: ThermalUnitResult
      extends: ResultEntity
      components:
        - name: qDot
          type: Power
          javaDoc: "Average thermal power flowing into the thermal unit (+: Power flowing into unit, -: Power\n
                  flowing from unit)"

    ThermalSinkResult:
      name: ThermalSinkResult
      extends: ThermalUnitResult

    ThermalStorageResult:
      name: ThermalStorageResult
      extends: ThermalSinkResult
      components:
        - name: energy
          type: Energy
          javaDoc: "Currently stored energy."

    AbstractThermalStorageResult:
      name: AbstractThermalStorageResult
      extends: ThermalStorageResult
      components:
        - name: fillLevel
          type: Dimensionless
          javaDoc: "Fill level of the storage."

    CylindricalStorageResult:
      name: CylindricalStorageResult
      extends: AbstractThermalStorageResult
      abstract: false

    DomesticHotWaterStorageResult:
      name: DomesticHotWaterStorageResult
      extends: AbstractThermalStorageResult
      abstract: false

    ThermalHouseResult:
      name: ThermalHouseResult
      extends: ThermalSinkResult
      abstract: false
      components:
        - name: indoorTemperature
          type: Temperature
          javaDoc: "Indoor room temperature of the house."









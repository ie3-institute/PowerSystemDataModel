version: 1.0
datamodel:
  models:
    UniqueEntity:
      name: UniqueEntity
      components:
        - name: uuid
          type: UUID

  models.input:
    UniqueInputEntity:
      name: UniqueInputEntity
      extends: UniqueEntity
      components:
        - name: additionalInformation
          type: StringMap
          keys: [additionalInformation]
          required: false

    AssetInput:
      name: AssetInput
      extends: UniqueInputEntity
      components:
        - name: id
          type: String
          javaDoc: "Name or ID of the asset."
        - name: operator
          type: OperatorInput
          required: true # TODO: Change this to false
          nested: true
          javaDoc: "The operator of this asset."
        - name: operationTime
          type: OperationTime
          keys: [operatesFrom, operatesUntil]
          required: true # TODO: Change this to false
          javaDoc: "Time for which the entity is operated."

    AssetTypeInput:
      name: AssetTypeInput
      extends: UniqueInputEntity
      components:
        - name: id
          type: String
          required: true
          javaDoc: "Name or ID of the asset."

    EmInput:
      name: EmInput
      extends: AssetInput
      abstract: false
      components:
        - name: controlStrategy
          type: String
          javaDoc: "Reference to the control strategy to be used for this model."
        - name: controllingEm
          type: EmInput
          nested: true
          required: false
          javaDoc: "Optional UUID of the parent {@link EmInput} that is controlling this em unit. If null, this em
                  unit is not em-controlled."

    IdCoordinateInput:
      name: IdCoordinateInput
      abstract: false
      components:
        - name: id
          type: int
        - name: point
          type: Point

    MeasurementUnitInput:
      name: MeasurementUnitInput
      abstract: false
      extends: AssetInput
      components:
        - name: node
          type: NodeInput
          javaDoc: "Grid node, the asset is attached to."
        - name: vMag
          type: bool
          javaDoc: "True, if the voltage magnitude is measured."
        - name: vAng
          type: bool
          javaDoc: "True, if the voltage angle is measured."
        - name: p
          type: bool
          javaDoc: "True, if the nodal residual active power is measured."
        - name: q
          type: bool
          javaDoc: "True, if the reactive power is measured."

    NodeInput:
      name: NodeInput
      abstract: false
      extends: AssetInput
      components:
        - name: vTarget
          type: Dimensionless
          javaDoc: "Target voltage magnitude of the node with regard to its rated voltage (typically in p.u.)."
        - name: slack
          type: bool
          javaDoc: "Is this node a slack node?"
        - name: geoPosition
          type: Point
          javaDoc: "The coordinates of this node, especially relevant for geo-dependant systems, that are connected to this node."
        - name: voltLvl
          type: VoltageLevel
          keys: [voltLvl, vRated]
          javaDoc: "Voltage level of this node."
        - name: subnet
          type: int
          javaDoc: "Subgrid of this node."

    OperatorInput:
      name: OperatorInput
      abstract: false
      extends: UniqueInputEntity
      components:
        - name: id
          type: String
          javaDoc: "The id (=name) of this operator."

  models.input.connector:
    ConnectorInput:
      name: ConnectorInput
      extends: AssetInput
      components:
        - name: nodeA
          type: NodeInput
          nested: true
          javaDoc: "Grid node at one side of the connector."
        - name: nodeB
          type: NodeInput
          nested: true
          javaDoc: "Grid node at the other side of the connector."
        - name: parallelDevices
          type: int
          javaDoc: "Amount of parallel devices."

    LineInput:
      name: LineInput
      extends: ConnectorInput
      abstract: false
      components:
        - name: type
          type: LineTypeInput
          nested: true
          javaDoc: "Type of this line, containing default values for lines of this kind."
        - name: length
          type: Length
          javaDoc: "Length of this line."
        - name: geoPosition
          type: LineString
          javaDoc: "Coordinates of this line."
        - name: olmCharacteristic
          type: OlmCharacteristicInput
          javaDoc: "Description of an optional weather dependent operation curve."

    SwitchInput:
      name: SwitchInput
      extends: ConnectorInput
      abstract: false
      unsupported: [parallelDevices]
      components:
        - name: closed
          type: bool
          javaDoc: "Is the switching state 'closed'?"

    TransformerInput:
      name: TransformerInput
      extends: ConnectorInput
      components:
        - name: tapPos
          type: int
          javaDoc: "Tap position of this transformer."
        - name: autoTap
          type: bool
          javaDoc: "True, if the tap position of the transformer is adapted automatically."

    Transformer2WInput:
      name: Transformer2WInput
      extends: TransformerInput
      abstract: false
      components:
        - name: type
          type: Transformer2WTypeInput
          nested: true
          javaDoc: "Type of this 2W transformer, containing default values for transformers of this kind."

    Transformer3WInput:
      name: Transformer3WInput
      extends: TransformerInput
      abstract: false
      components:
        - name: type
          type: Transformer3WTypeInput
          nested: true
          javaDoc: "Type of this 3W transformer, containing default values for transformers of this kind."
        - name: nodeC
          type: NodeInput
          nested: true
          javaDoc: "The lower voltage node."
        - name: nodeInternal
          type: NodeInput
          nested: true
          javaDoc: "Internal node of the transformers T equivalent circuit."

  models.input.connector.type:
    CableTypeInput:
      name: CableTypeInput
      extends: AssetTypeInput
      abstract: false
      components:
        - name: coreNumber
          type: int
        - name: conductor
          type: ConductorInput
        - name: isolation
          type: LayerList
        - name: screen
          type: ScreenLayerInput
          required: false
        - name: filler
          type: LayerList
        - name: armor
          type: LayerList
        - name: jack
          type: LayerList
        - name: limitTemperature
          type: Temperature
        - name: frequency
          type: Frequency
        - name: skinEffectCoefficient
          type: double
        - name: proximityEffectCoefficient
          type: double
        - name: electricalCapacitance
          type: ElectricCapacitance
        - name: tanDelta
          type: double
        - name: circulatingLossFactor
          type: double
        - name: eddyCurrentLossFactor
          type: double

    ConductorInput:
      name: ConductorInput
      extends: AssetInput
      abstract: false
      components:
        - name: material
          type: CableMaterial
        - name: crossSection
          type: Area
        - name: diameter
          type: Length
        - name: isCompacted
          type: bool
        - name: thermalResistivity
          type: ThermalResistivity
        - name: thermalCapacitance
          type: ThermalCapacitance
        - name: area
          type: Area

    LayerInput:
      name: LayerInput
      extends: AssetTypeInput
      abstract: false
      components:
        - name: material
          type: CableMaterial
        - name: innerDiameter
          type: Length
        - name: outerDiameter
          type: Length
        - name: thermalResistivity
          type: ThermalResistivity
        - name: thermalCapacitance
          type: ThermalCapacitance
        - name: area
          type: Area
          required: false

    LineTypeInput:
      name: LineTypeInput
      extends: AssetTypeInput
      abstract: false
      components:
        - name: b
          type: SpecificConductance
          javaDoc: "Specific phase-to-ground susceptance for this type of line (typically in µS/km)."
        - name: g
          type: SpecificConductance
          javaDoc: "Specific phase-to-ground conductance for this type of line (typically in µS/km)."
        - name: r
          type: SpecificResistance
          javaDoc: "Specific resistance for this type of line (typically in Ohm/km)."
        - name: x
          type: SpecificResistance
          javaDoc: "Specific reactance for this type of line (typically in Ohm/km)."
        - name: iMax
          type: ElectricCurrent
          javaDoc: "Maximum thermal current for this type of line (typically in A)."
        - name: vRated
          type: ElectricPotential
          javaDoc: "Rated voltage for this type of line (typically in V)."

    ScreenLayerInput:
      name: ScreenLayerInput
      extends: AssetTypeInput
      abstract: false
      components:
        - name: material
          type: CableMaterial
        - name: innerDiameter
          type: Length
        - name: outerDiameter
          type: Length
        - name: thermalResistivity
          type: ThermalResistivity
        - name: thermalCapacitance
          type: ThermalCapacitance
        - name: area
          type: Area
          required: false
        - name: wiresNumber
          type: int
        - name: wireDiameter
          type: Length
        - name: lengthOfLay
          type: Length
          required: false
        - name: electricalResistivity
          type: ElectricalResistivity

    Transformer2WTypeInput:
      name: Transformer2WTypeInput
      extends: AssetTypeInput
      abstract: false
      components:
        - name: rSc
          type: ElectricResistance
          javaDoc: "Short circuit resistance (typically in Ohm)."
        - name: xSc
          type: ElectricResistance
          javaDoc: "Short circuit reactance (typically in Ohm)."
        - name: sRated
          type: Power
          javaDoc: "Rated apparent power (typically in kVA)."
        - name: vRatedA
          type: ElectricPotential
          javaDoc: "Rated voltage of the high voltage winding (typically in kV)."
        - name: vRatedB
          type: ElectricPotential
          javaDoc: "Rated voltage of the low voltage winding (typically in kV)."
        - name: gM
          type: ElectricConductance
          javaDoc: "Phase-to-ground conductance (typically in nS)."
        - name: bM
          type: ElectricConductance
          javaDoc: "Phase-to-ground susceptance (typically in nS)."
        - name: dV
          type: Percent
          javaDoc: "Voltage magnitude deviation per tap position (typically in %)."
        - name: dPhi
          type: DegreeGeom
          javaDoc: "Voltage angle deviation per tap position (typically in °)."
        - name: tapSide
          type: bool
          javaDoc: "Selection of winding, where the tap changer is installed. Low voltage, if true."
        - name: tapNeutr
          type: int
          javaDoc: "Neutral tap position."
        - name: tapMin
          type: int
          javaDoc: "Minimum available tap position."
        - name: tapMax
          type: int
          javaDoc: "Maximum available tap position."

    Transformer3WTypeInput:
      name: Transformer3WTypeInput
      extends: AssetTypeInput
      abstract: false
      components:
        - name: sRatedA
          type: Power
          javaDoc: "Rated apparent power of the high voltage winding (typically in kVA)."
        - name: sRatedB
          type: Power
          javaDoc: "Rated apparent power of the medium voltage winding (typically in kVA)."
        - name: sRatedC
          type: Power
          javaDoc: "Rated apparent power of the low voltage windings (typically in kVA)."
        - name: vRatedA
          type: ElectricPotential
          javaDoc: "Rated voltage of the high voltage winding (typically in kV)."
        - name: vRatedB
          type: ElectricPotential
          javaDoc: "Rated voltage of the medium voltage winding (typically in kV)."
        - name: vRatedC
          type: ElectricPotential
          javaDoc: "Rated voltage of the low voltage winding (typically in kV)."
        - name: rScA
          type: ElectricResistance
          javaDoc: "Short-circuit resistance of the high voltage winding (typically in Ohm)."
        - name: rScB
          type: ElectricResistance
          javaDoc: "Short-circuit resistance of the medium voltage winding (typically in Ohm)."
        - name: rScC
          type: ElectricResistance
          javaDoc: "Short-circuit resistance of the low voltage winding (typically in Ohm)."
        - name: xScA
          type: ElectricResistance
          javaDoc: "Short-circuit reactance of the high voltage winding (typically in Ohm)."
        - name: xScB
          type: ElectricResistance
          javaDoc: "Short-circuit reactance of the medium voltage winding (typically in Ohm)."
        - name: xScC
          type: ElectricResistance
          javaDoc: "Short-circuit reactance of the low voltage winding (typically in Ohm)."
        - name: gM
          type: ElectricConductance
          javaDoc: "Phase-to-ground conductance (typically in nS)."
        - name: bM
          type: ElectricConductance
          javaDoc: "Phase-to-ground susceptance (typically in nS)."
        - name: dV
          type: Percent
          javaDoc: "Voltage magnitude deviation per tap position (typically in %)."
        - name: dPhi
          type: DegreeGeom
          javaDoc: "Voltage angle deviation per tap position (typically in °)."
        - name: tapNeutr
          type: int
          javaDoc: "Neutral tap position."
        - name: tapMin
          type: int
          javaDoc: "Minimum available tap position."
        - name: tapMax
          type: int
          javaDoc: "Maximum available tap position."

  models.input.system:
    SystemParticipantInput:
      name: SystemParticipantInput
      extends: AssetInput
      components:
        - name: node
          type: NodeInput
          nested: true
          javaDoc: "The node that the asset is connected to."
        - name: qCharacteristics
          type: ReactivePowerCharacteristic
          javaDoc: "Description of a reactive power characteristic. For details see further documentation."
        - name: controllingEm
          type: EmInput
          nested: true
          required: false
          javaDoc: "Optional {@link EmInput} that is controlling this system participant. If null, this system participant is not em-controlled."

    AcInput:
      name: AcInput
      extends: SystemParticipantInput
      abstract: false
      components:
        - name: type
          type: AcTypeInput
          nested: true
          javaDoc: "Type of this air condition, containing default values for air condition of this kind."
        - name: thermalBus
          type: ThermalBusInput
          nested: true
          javaDoc: "The thermal bus, this model is connected to."

    BmInput:
      name: BmInput
      extends: SystemParticipantInput
      abstract: false
      components:
        - name: type
          type: BmTypeInput
          nested: true
          javaDoc: "Type of this BM plant, containing default values for BM plants of this kind."
        - name: costControlled
          type: bool
          javaDoc: "Does this plant increase the output power if the revenues exceed the energy generation costs?"
        - name: feedInTariff
          type: EnergyPrice
          javaDoc: "Granted feed in tariff (typically in €/MWh)."

    ChpInput:
      name: ChpInput
      extends: SystemParticipantInput
      abstract: false
      components:
        - name: thermalBus
          type: ThermalBusInput
          nested: true
          javaDoc: "The thermal bus, this model is connected to."
        - name: type
          type: ChpTypeInput
          nested: true
          javaDoc: "Type of this CHP plant, containing default values for CHP plants of this kind."
        - name: thermalStorage
          type: ThermalStorageInput
          nested: true
          javaDoc: "Thermal storage model."

    EvcsInput:
      name: EvcsInput
      extends: SystemParticipantInput
      abstract: false
      components:
        - name: type
          type: ChargingPointType
          javaDoc: "Type of all installed charging points."
        - name: chargingPoints
          type: int
          javaDoc: "Number of installed charging points."
        - name: cosPhiRated
          type: double
          javaDoc: "Rated power factor."
        - name: locationType
          type: EvcsLocationType
          javaDoc: "Evcs location type."
        - name: v2gSupport
          type: bool
          javaDoc: "Whether charging station supports vehicle to grid."

    EvInput:
      name: EvInput
      extends: SystemParticipantInput
      abstract: false
      components:
        - name: type
          type: EvTypeInput
          nested: true
          javaDoc: "Type of this EV, containing default values for EVs of this kind."

    FixedFeedInInput:
      name: FixedFeedInInput
      extends: SystemParticipantInput
      abstract: false
      components:
        - name: sRated
          type: Power
          javaDoc: "Rated apparent power (typically in kVA)."
        - name: cosPhiRated
          type: double
          javaDoc: "Rated power factor."

    HpInput:
      name: HpInput
      extends: SystemParticipantInput
      abstract: false
      components:
        - name: type
          type: HpTypeInput
          nested: true
          javaDoc: "Type of this heat pump, containing default values for heat pump of this kind."
        - name: thermalBus
          type: ThermalBusInput
          nested: true
          javaDoc: "The thermal bus, this model is connected to."

    LoadInput:
      name: LoadInput
      extends: SystemParticipantInput
      abstract: false
      components:
        - name: loadProfile
          type: PowerProfileKey
          javaDoc: "Reference to a load profile to use for the model. If you intend to assign specific values,\n
                 create an timeSeries and assign it via an external mapping (e.g. by providing a global time\n
                 series for a specific load profile) to this model."
        - name: eConsAnnual
          type: Energy
          javaDoc: "Annually consumed energy (typically in kWh)."
        - name: sRated
          type: Power
          javaDoc: "Active Power (typically in kVA)."
        - name: cosPhiRated
          type: double
          javaDoc: "Rated power factor."

    PvInput:
      name: PvInput
      extends: SystemParticipantInput
      abstract: false
      components:
        - name: albedo
          type: double
          javaDoc: "Albedo value (typically a value between 0 and 1)."
        - name: azimuth
          type: DegreeGeom
          javaDoc: "Inclination in a compass direction (typically °: South 0◦; West 90◦; East -90◦)."
        - name: etaConv
          type: Percent
          javaDoc: "Efficiency of converter (typically in %)."
        - name: elevationAngle
          type: DegreeGeom
          javaDoc: "Tilted inclination from horizontal (typically in °)."
        - name: kG
          type: double
          javaDoc: "Generator correction factor merging different technical influences."
        - name: kT
          type: double
          javaDoc: "Temperature correction factor."
        - name: sRated
          type: Power
          javaDoc: "Rated apparent power (typically in kVA)."
        - name: cosPhiRated
          type: double
          javaDoc: "Rated power factor."

    StorageInput:
      name: StorageInput
      extends: SystemParticipantInput
      abstract: false
      components:
        - name: type
          type: StorageTypeInput
          nested: true
          javaDoc: "Type of this storage, containing default values for storages of this kind."

    WecInput:
      name: WecInput
      extends: SystemParticipantInput
      abstract: false
      components:
        - name: type
          type: WecTypeInput
          nested: true
          javaDoc: "Type of this WEC, containing default values for WEC assets of this kind."

  models.input.system.type:
    SystemParticipantTypeInput:
      name: SystemParticipantTypeInput
      extends: AssetTypeInput
      components:
        - name: capex
          type: Currency
          javaDoc: "Capital expense for this type of system participant (typically in €)."
        - name: opex
          type: EnergyPrice
          javaDoc: "Operating expense for this type of system participant (typically in €/MWh)."
        - name: sRated
          type: Power
          javaDoc: "Rated apparent power of the type (in kVA)."
        - name: cosPhiRated
          type: double
          javaDoc: "Power factor for this type of system participant."

    AcTypeInput:
      name: AcTypeInput
      extends: SystemParticipantTypeInput
      abstract: false
      components:
        - name: pThermal
          type: Power
          javaDoc: "Thermal output of the air condition (typically in kW), when sRated * cosPhiRated is consumed."

    BmTypeInput:
      name: BmTypeInput
      extends: SystemParticipantTypeInput
      abstract: false
      components:
        - name: activePowerGradient
          type: DimensionlessRate
          javaDoc: "Permissible load gradient (typically in %/h)."
        - name: etaConv
          type: Dimensionless
          javaDoc: "Efficiency of converter for this type of BM (typically in %)."

    ChpTypeInput:
      name: ChpTypeInput
      extends: SystemParticipantTypeInput
      abstract: false
      components:
        - name: etaEl
          type: Dimensionless
          javaDoc: "Electrical efficiency (typically in %)."
        - name: etaThermal
          type: Dimensionless
          javaDoc: "Thermal efficiency (typically in %)."
        - name: pThermal
          type: Power
          javaDoc: "Rated thermal power (typically in kW)."
        - name: pOwn
          type: Power
          javaDoc: "Internal consumption (typically in kW)."

    EvTypeInput:
      name: EvTypeInput
      extends: SystemParticipantTypeInput
      abstract: false
      components:
        - name: eStorage
          type: Energy
          javaDoc: "Energy capacity of the storage (typically in kWh)."
        - name: eCons
          type: SpecificEnergy
          javaDoc: "Consumed electric energy per driven distance (typically in kWh/km)."
        - name: sRatedDC
          type: Power
          javaDoc: "Power for DC (typically in kW)."

    HpTypeInput:
      name: HpTypeInput
      extends: SystemParticipantTypeInput
      abstract: false
      components:
        - name: pThermal
          type: Power
          javaDoc: "Thermal output of the heat pump (typically in kW), when sRated * cosPhiRated is consumed."

    StorageTypeInput:
      name: StorageTypeInput
      extends: SystemParticipantTypeInput
      abstract: false
      components:
        - name: eStorage
          type: Energy
          javaDoc: "."
        - name: pMax
          type: Power
          javaDoc: "."
        - name: activePowerGradient
          type: DimensionlessRate
          javaDoc: "."
        - name: eta
          type: Dimensionless
          javaDoc: "."

    WecTypeInput:
      name: WecTypeInput
      extends: SystemParticipantTypeInput
      abstract: false
      components:
        - name: cpCharacteristic
          type: WecCharacteristicInput
          javaDoc: "."
        - name: etaConv
          type: Dimensionless
          javaDoc: "."
        - name: rotorArea
          type: Area
          javaDoc: "."
        - name: hubHeight
          type: Length
          javaDoc: "."

  models.input.thermal:
    ThermalInput:
      name: ThermalInput
      extends: AssetInput

    ThermalUnitInput:
      name: ThermalUnitInput
      extends: ThermalInput
      components:
        - name: thermalBus
          type: ThermalBusInput
          nested: true
          javaDoc: "The thermal bus, a thermal unit is connected to."

    ThermalStorageInput:
      name: ThermalStorageInput
      extends: ThermalUnitInput

    AbstractStorageInput:
      name: AbstractStorageInput
      extends: ThermalStorageInput
      components:
        - name: storageVolumeLvl
          type: Volume
          javaDoc: "Available storage volume (typically in m³)."
        - name: inletTemp
          type: Temperature
          javaDoc: "Temperature of the inlet (typically in C)."
        - name: returnTemp
          type: Temperature
          javaDoc: "Temperature of the outlet (typically in C)."
        - name: c
          type: SpecificHeatCapacity
          javaDoc: "Specific heat capacity of the storage medium (typically in kWh/K*m³)."
        - name: pThermalMax
          type: Power
          javaDoc: "Maximum permissible thermal power (typically in kW)."

    CylindricalStorageInput:
      name: CylindricalStorageInput
      extends: AbstractStorageInput
      abstract: false

    DomesticHotWaterStorageInput:
      name: DomesticHotWaterStorageInput
      extends: AbstractStorageInput
      abstract: false

    ThermalBusInput:
      name: ThermalBusInput
      extends: ThermalInput
      abstract: false

    ThermalSinkInput:
      name: ThermalSinkInput
      extends: ThermalUnitInput

    ThermalHouseInput:
      name: ThermalHouseInput
      extends: ThermalSinkInput
      abstract: false
      components:
        - name: ethLosses
          type: ThermalConductance
          javaDoc: "Thermal, transitional losses of the included thermal house model (typically in kW/K)."
        - name: ethCapa
          type: HeatCapacity
          javaDoc: "Thermal capacity of the included thermal house model (typically in kWh/K)."
        - name: targetTemperature
          type: Temperature
          javaDoc: "Desired target temperature of the thermal house model (typically in °C)."
        - name: upperTemperatureLimit
          type: Temperature
          javaDoc: "Upper boundary temperature of the thermal house model (typically in °C)."
        - name: lowerTemperatureLimit
          type: Temperature
          javaDoc: "Lower boundary temperature of the thermal house model (typically in °C)."
        - name: housingType
          type: String
          javaDoc: "Type of the building, e.g. house or flat."
        - name: numberOfInhabitants
          type: double
          javaDoc: "Number of people living in the building, double to allow proper scaling."

  models.result:
    ResultEntity:
      name: ResultEntity
      components:
        - name: time
          type: ZonedDateTime
          javaDoc: "Date and time of the produced result."
        - name: inputModel
          type: UUID
          javaDoc: "Uuid of the input model that produces the result."

    NodeResult:
      name: NodeResult
      extends: ResultEntity
      abstract: false
      components:
        - name: vMag
          type: Dimensionless
          javaDoc: "Voltage magnitude @ this node in p.u."
        - name: vAng
          type: Angle
          javaDoc: "Voltage angle @ this node in degree."

    CongestionResult:
      name: CongestionResult
      extends: ResultEntity
      abstract: false
      components:
        - name: subgrid
          type: int
        - name: type
          type: InputModelType
        - name: value
          type: Dimensionless
        - name: min
          type: Dimensionless
        - name: max
          type: Dimensionless

  models.result.connector:
    ConnectorResult:
      name: ConnectorResult
      extends: ResultEntity
      components:
        - name: iAMag
          type: ElectricCurrent
          javaDoc: "Electric current magnitude @ port A, normally provided in Ampere."
        - name: iAAng
          type: Angle
          javaDoc: "Electric current angle @ Port A in degree °."
        - name: iBMag
          type: ElectricCurrent
          javaDoc: "Electric current magnitude @ port B, normally provided in Ampere."
        - name: iBAng
          type: Angle
          javaDoc: "Electric current angle @ Port B in degree °."

    LineResult:
      name: LineResult
      extends: ConnectorResult
      abstract: false

    SwitchResult:
      name: SwitchResult
      extends: ResultEntity
      abstract: false
      components:
        - name: closed
          type: bool
          javaDoc: "Is the switching state 'closed'?"

    TransformerResult:
      name: TransformerResult
      extends: ConnectorResult
      abstract: false
      components:
        - name: tapPos
          type: int
          javaDoc: "Current tapping position if a transformer has a tap changer."

    Transformer2WResult:
      name: Transformer2WResult
      extends: TransformerResult
      abstract: false

    Transformer3WResult:
      name: Transformer3WResult
      extends: TransformerResult
      abstract: false
